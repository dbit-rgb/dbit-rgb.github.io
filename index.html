<script>
(function(){
'use strict';
document.documentElement.lang='ru';

// ---------- shared helpers ----------
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
// the two standalone pages used cz-a1a2-done / cz-a1a2-lesson (grammar) and "known" (words)
const KEYS={done:'cz-a1a2-done',lesson:'cz-a1a2-lesson',section:'cz-a1a2-section',known:'cz-a1a2-known',words:'cz-a1a2-words',mem:'cz-a1a2-mem',glog:'cz-a1a2-glog',day:'cz-a1a2-day',guide:'cz-a1a2-guide'};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const stripMarks=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const plural=(n,f)=>{const a=n%100,b=n%10;return f[a>10&&a<20?2:b===1?0:b>=2&&b<=4?1:2]};
const motionOK=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches;
const svg=(d,w)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2.2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON={
  check:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>',2.4),
  cross:svg('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',2.4),
  speak:svg('<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>',2),
  chev:svg('<path d="M9.5 6l6 6-6 6"/>',2.2)
};
const live=$('#live');
const announce=msg=>{live.textContent='';setTimeout(()=>{live.textContent=msg},40)};

// ---------- data ----------
GRAM.forEach(L=>L.rules.forEach((r,ri)=>{r.id=`l${L.n}r${ri}`;r.ex.forEach((x,xi)=>{x.id=`${r.id}x${xi}`})}));
Object.entries(GUIDES).forEach(([rid,g])=>g.forEach((s,i)=>{if(s.x)s.x.id=`${rid}g${i}`}));
const WORDS={};
Object.keys(D).forEach(k=>{
  WORDS[k]=D[k].split('\n').map(l=>l.split(' | ')).filter(p=>p.length===2&&p[0].trim()&&p[1].trim())
    .map(([cz,ru])=>({id:k+'|'+cz.trim(),n:+k,cz:cz.trim(),ru:ru.trim()}));
});
const LAST=GRAM.length;

// ---------- progress ----------
const strings=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'):[];
function loadKnown(){
  const v=store.get(KEYS.known,null);
  if(Array.isArray(v))return strings(v);
  const old=store.get('known',null);
  if(Array.isArray(old)&&old.length&&old.every(x=>typeof x==='string'&&/^\d+\|/.test(x))){store.set(KEYS.known,old);return old}
  return [];
}
const done=new Set(strings(store.get(KEYS.done,[])));
const saveDone=()=>store.set(KEYS.done,[...done]);
const gramItems=L=>L.rules.flatMap(r=>r.ex);
const gramStat=n=>{const it=gramItems(GRAM[n-1]);return{done:it.filter(x=>done.has(x.id)).length,total:it.length}};
const pct=s=>s.total?Math.round(s.done/s.total*100):0;

// ---------- memory: spaced repetition of words ----------
// A word climbs levels 1-7. Each correct answer on the day it is due moves it up one level, a mistake
// sends it back to level 1. Level 3 and above counts as learned: the word was written correctly on two
// different days after it was first learned. IV holds the days until the next review for each level.
const IV=[0,1,2,4,7,14,30,60],LEARNED=3;
// study days end at 4 am, so a late evening session still counts for that day
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4-4*36e5)/864e5);
const hashId=s=>{let h=0;for(const c of s)h=(h*31+c.codePointAt(0))>>>0;return h};
const Mem=(()=>{
  const w={}; // id → [level, due day, correct answers, mistakes]
  const raw=store.get(KEYS.mem,null);
  if(raw&&raw.w&&typeof raw.w==='object'){
    for(const [id,v] of Object.entries(raw.w))if(Array.isArray(v)&&v.length>=2&&Number.isFinite(v[0])&&Number.isFinite(v[1])&&v[0]>0)w[id]=[Math.min(v[0]|0,IV.length-1),v[1]|0,v[2]|0,v[3]|0];
  }else{
    // first run of the spaced trainer: words marked as known stay learned and come up for a check within a week
    const t=today();loadKnown().forEach(id=>{w[id]=[LEARNED,t+1+hashId(id)%7,0,0]});
    save();
  }
  // cz-a1a2-known keeps listing the learned words, so the older pages still read them
  function save(){store.set(KEYS.mem,{v:1,w});store.set(KEYS.known,Object.keys(w).filter(id=>w[id][0]>=LEARNED))}
  const put=(id,l,d,ok,bad)=>{const m=w[id]||[0,0,0,0];w[id]=[l,d,m[2]+(ok||0),m[3]+(bad||0)];save()};
  return {
    level:id=>w[id]?w[id][0]:0,
    dueDay:id=>w[id]?w[id][1]:null,
    learnt(id){put(id,1,today()+IV[1],1)},              // a new word was written correctly for the first time
    know(id){put(id,LEARNED,today()+IV[LEARNED],1)},    // the learner says the word is already known
    promote(id){put(id,LEARNED,today()+2,1)},           // «Урок за день»: written right in the evening check, checked again in 2 days
    reset(ids){ids.forEach(id=>{delete w[id]});save()},
    // res: 'ok', 'near' (right except diacritics) or 'fail'. An early correct answer leaves the schedule alone.
    answer(id,res){
      const t=today(),m=w[id];
      if(!m){if(res==='ok')put(id,1,t+IV[1],1);return}
      if(res==='ok'){if(m[1]>t)return;const l=Math.min(IV.length-1,m[0]+1);put(id,l,t+IV[l],1)}
      else if(res==='near')put(id,Math.max(1,m[0]-1),t+1,0,1);
      else put(id,1,t+1,0,1);
    }
  };
})();
const wordStat=n=>{
  const ws=WORDS[n]||[],t=today();let k=0,l=0,due=0;
  ws.forEach(w=>{const v=Mem.level(w.id);if(!v)return;if(v>=LEARNED)k++;else l++;if(Mem.dueDay(w.id)<=t)due++});
  return{done:k,learning:l,due,total:ws.length};
};

// ---------- grammar log: how the last attempt at each exercise went ----------
// id → [1 solved at the first try, 0 with a mistake; study day]. The mixed training starts from the mistakes.
const glog=(v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{})(store.get(KEYS.glog,{}));
const weakEx=id=>!!glog[id]&&glog[id][0]===0;
const logEx=(id,ok)=>{glog[id]=[ok?1:0,today()];store.set(KEYS.glog,glog)};
// «Разбор по шагам»: ruleId → {s: the furthest step opened, d: 1 once the walkthrough was finished}
const gstate=(v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{})(store.get(KEYS.guide,{}));

const FOOT='<p>Грамматика — по разделам учебника «Čeština pro cizince A1/A2» (Boccou Kestřánková, Štěpánková, Vodičková). Объяснения сокращены, упражнения составлены заново. Слова — по словарю из письма Романы Грмеловой.</p><p>Прогресс сохраняется только в этом браузере.</p>';

// ---------- shell: navigation, header, routing ----------
const app={lesson:0,section:'gram'};
const nav=$('#nav'),view=$('#view');
const hashFor=(n,s)=>'#l'+n+(s==='slova'?'-slova':'');
function parseHash(){
  const m=/^#l(\d{1,2})(?:r(\d{1,2}))?(?:-(slova|gramatika))?$/.exec(location.hash);
  return m?{n:+m[1],rule:m[2]!=null?+m[2]:null,section:m[3]==='slova'?'slova':'gram'}:null;
}

function buildNav(){
  nav.innerHTML=GRAM.map(L=>`<a href="#l${L.n}" data-n="${L.n}"><span class="num">${L.n}</span><span class="t"><span>${esc(L.cz)}</span><span class="due" hidden></span></span><span class="bars" aria-hidden="true"><span class="bar"><i></i></span><span class="bar"><i class="mid"></i><i></i></span></span></a>`).join('');
}
// the words bar: learned words in green over the ones still being learned
function wordBar(bar,w){
  $('i.mid',bar).style.width=(w.total?Math.round((w.done+w.learning)/w.total*100):0)+'%';
  $('i:not(.mid)',bar).style.width=pct(w)+'%';
}
const wordsLabel=w=>`выучено ${w.done} из ${w.total}`+(w.learning?`, учатся ${w.learning}`:'')+(w.due?`, на повторение ${w.due}`:'');
function updateNav(){
  $$('a',nav).forEach(a=>{
    const n=+a.dataset.n,g=gramStat(n),w=wordStat(n);
    a.setAttribute('href',hashFor(n,app.section));
    if(n===app.lesson)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
    const b=$$('.bar',a);$('i',b[0]).style.width=pct(g)+'%';wordBar(b[1],w);
    const d=$('.due',a);d.hidden=!w.due;d.textContent=w.due;
    a.setAttribute('aria-label',`Урок ${n}: ${GRAM[n-1].cz}. Грамматика: решено ${g.done} из ${g.total}. Слова: ${wordsLabel(w)}`);
  });
}
function centerNav(){
  if(!matchMedia('(max-width:820px)').matches)return;
  const a=$('a[aria-current]',nav);if(a)nav.scrollLeft=a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2;
}
function refreshProgress(){
  updateNav();
  const n=app.lesson,g=gramStat(n),w=wordStat(n);
  const tabs=$$('.sections a',view);
  if(tabs.length===2){
    $('.sm',tabs[0]).textContent=`решено ${g.done} из ${g.total}`;$('.bar i',tabs[0]).style.width=pct(g)+'%';
    $('.sm',tabs[1]).textContent=`выучено ${w.done} из ${w.total}`+(w.due?`, на повторение ${w.due}`:'');wordBar($('.bar',tabs[1]),w);
  }
  if(app.section==='gram')Grammar.refresh();else Words.refresh();
}
function render(){
  const L=GRAM[app.lesson-1];
  kbd.hidden=true;
  view.innerHTML='';
  const head=el('header','lhead',`<div class="lnum" aria-hidden="true">${L.n}</div><div class="ltitle"><h1 tabindex="-1"><span class="sr">Урок ${L.n}. </span>${esc(L.cz)}</h1><p>${esc(L.ru)}</p></div>`);
  const tabs=el('nav','sections',[['gram','Грамматика'],['slova','Слова']].map(([s,t])=>`<a href="${hashFor(L.n,s)}" data-s="${s}"${s===app.section?' aria-current="page"':''}><b>${t}</b><span class="sm"></span><span class="bar" aria-hidden="true">${s==='slova'?'<i class="mid"></i>':''}<i></i></span></a>`).join(''));
  tabs.setAttribute('aria-label','Раздел урока');
  const panel=el('div',app.section==='gram'?'gpanel':'wpanel');
  view.append(head,tabs,panel);
  if(app.section==='gram')Grammar.render(panel,L);else Words.render(panel,L.n);
  view.appendChild(el('footer','foot',FOOT));
  refreshProgress();
  centerNav();
}
function route(byUser){
  const h=parseHash();
  let n=h?h.n:+store.get(KEYS.lesson,1);
  let s=h?h.section:store.get(KEYS.section,'gram');
  if(!(n>=1&&n<=LAST))n=1;
  if(s!=='slova')s='gram';
  const prev=document.activeElement;
  const fromTabs=!!(prev&&prev.closest&&prev.closest('.sections'));
  const fromNav=!!(prev&&prev.closest&&prev.closest('#nav'));
  // switching Грамматика/Слова inside one lesson keeps the tabs where they were
  const sameLesson=byUser&&n===app.lesson,y=window.scrollY;
  app.lesson=n;app.section=s;
  store.set(KEYS.lesson,n);store.set(KEYS.section,s);
  if(!h){try{history.replaceState(null,'',hashFor(n,s))}catch(e){}}
  render();
  const target=h&&h.rule!=null&&s==='gram'?document.getElementById(`l${n}r${h.rule}`):null;
  if(target)target.scrollIntoView();else window.scrollTo(0,sameLesson?y:0);
  if(!byUser)return;
  if(fromTabs){const a=$(`.sections a[data-s="${s}"]`);if(a)a.focus({preventScroll:true})}
  else if(!fromNav){const t=target?$('h2',target):$('#view h1');if(t)t.focus({preventScroll:true})}
}

// ---------- grammar: rules and exercises ----------
const Grammar=(()=>{
  const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  const KIND={c:'Выберите',i:'Впишите',o:'Составьте предложение',m:'Соедините пары'};
  const norm=s=>s.toLowerCase().replace(/[„“"«»]/g,'').replace(/\s+/g,' ').replace(/[\s.!?,;:]+$/,'').trim();
  const flat=s=>stripMarks(norm(s));
  const qHTML=q=>q.replace(/___/g,'<span class="gap">…</span>');
  let cur=null,root=null;

  function render(panel,L){
    cur=L;root=panel;
    const toc=el('nav','toc');toc.setAttribute('aria-label','Правила урока');
    L.rules.forEach((r,ri)=>{
      const a=el('a','',`${ROMAN[ri]}. ${esc(r.cz)}${ICON.check}<span class="wk" hidden><span class="sr">, есть ошибки</span></span>`);a.href='#'+r.id;
      a.addEventListener('click',e=>{e.preventDefault();const t=document.getElementById(r.id);if(!t)return;t.scrollIntoView({behavior:motionOK()?'smooth':'auto'});const h=$('h2',t);if(h)h.focus({preventScroll:true})});
      toc.appendChild(a);
    });
    const mixb=el('button','mixbtn','Смешанная тренировка');mixb.type='button';toc.appendChild(mixb);
    const mix=el('section','mix');mix.hidden=true;mix.setAttribute('aria-labelledby','mix-h');
    mixb.addEventListener('click',()=>{
      mix.hidden=false;
      const set=pickMix(L),c=[0,0,0];set.forEach(o=>c[o.k]++);
      const has=[c[0]&&`с прошлой ошибкой ${c[0]}`,c[1]&&`нерешённых ${c[1]}`,c[2]&&`для повторения ${c[2]}`].filter(Boolean).join(', ');
      mix.innerHTML=`<h2 id="mix-h" tabindex="-1">Смешанная тренировка</h2><p>${set.length} ${plural(set.length,['задание','задания','заданий'])} из всех правил урока. Сначала идут задания, где была ошибка, потом нерешённые, потом решённые давно. Правила перемешаны, чтобы учиться узнавать, какое из них нужно. В этом наборе: ${has}. Нажмите кнопку ещё раз, чтобы получить новый набор.</p>`;
      const items=el('div','items');
      set.forEach((o,i)=>items.appendChild(renderItem(o.x,i+1,'mix-',true)));
      mix.appendChild(items);
      mix.scrollIntoView({block:'start',behavior:motionOK()?'smooth':'auto'});
      $('#mix-h',mix).focus({preventScroll:true});
    });
    panel.append(toc,mix);
    L.rules.forEach((r,ri)=>{
      const s=el('section','rule');s.id=r.id;s.setAttribute('aria-labelledby',r.id+'-h');
      s.innerHTML=`<div class="rhead"><span class="roman" aria-hidden="true">${ROMAN[ri]}.</span><h2 id="${r.id}-h" tabindex="-1">${r.cz}</h2><span class="ru">${r.ru}</span></div><div class="explain">${r.html}</div>`;
      if(GUIDES[r.id])$('.rhead',s).after(guideBar(r));
      const w=el('div','exwrap');
      const h=el('div','exhead',`<h3>Упражнения</h3><span class="exmeta"><span class="score"></span><button type="button" class="linkbtn">Сбросить</button></span>`);
      $('.linkbtn',h).addEventListener('click',()=>{
        r.ex.forEach(x=>done.delete(x.id));saveDone();
        w.replaceChild(renderItems(r),$('.items',w));
        refreshProgress();announce('Упражнения правила сброшены');
      });
      w.append(h,renderItems(r));s.appendChild(w);panel.appendChild(s);
    });
  }
  function renderItems(r){const it=el('div','items');r.ex.forEach((x,i)=>it.appendChild(renderItem(x,i+1,'')));return it}
  // 12 exercises, weakest first: a mistake last time, then never tried, then solved longest ago.
  // Neighbours come from different rules where possible, so each task starts with "which rule is this?"
  function pickMix(L){
    const all=shuffle(L.rules.flatMap(r=>r.ex.filter(x=>x.t!=='m').map(x=>{const g=glog[x.id];return {x,r:r.id,k:g?(g[0]?2:0):done.has(x.id)?2:1,d:g?g[1]:-1}})));
    all.sort((a,b)=>a.k-b.k||a.d-b.d);
    const pool=all.slice(0,12),out=[];
    while(pool.length){let i=pool.findIndex(o=>!out.length||o.r!==out[out.length-1].r);if(i<0)i=0;out.push(pool.splice(i,1)[0])}
    return out;
  }
  function refresh(){
    if(!cur||!root||!root.isConnected)return;
    cur.rules.forEach(r=>{
      const n=r.ex.filter(x=>done.has(x.id)).length,wk=r.ex.filter(x=>weakEx(x.id)).length;
      const s=$(`#${r.id} .score`,root);if(s)s.textContent=`${n} из ${r.ex.length}`+(wk?`, с ошибкой ${wk}`:'');
      const t=$(`.toc a[href="#${r.id}"]`,root);if(t){t.classList.toggle('done',n===r.ex.length);$('.wk',t).hidden=!wk}
    });
  }
  function mark(x,card,ok,track=true){
    card.classList.remove('near');
    card.classList.toggle('ok',ok);card.classList.toggle('bad',!ok);
    if(!ok)return;
    card.classList.add('is-done');
    if(track&&!done.has(x.id)){done.add(x.id);saveDone();refreshProgress()}
  }

  // ---------- «Разбор по шагам»: a guided walk through a harder rule ----------
  // One idea per step: a short explanation, examples with the endings in red, and a check question.
  // The check questions do not count towards the rule's exercises.
  function guideBar(r){
    const g=GUIDES[r.id],st=gstate[r.id]||{},n=g.length;
    const bar=el('div','gbar'+(st.d?' done':''));
    bar.innerHTML=`<p><b>${st.d?ICON.check+'Разбор по шагам пройден.':'Разбор по шагам.'}</b> ${n} ${plural(n,['шаг','шага','шагов'])}, около ${n} ${plural(n,['минуты','минут','минут'])}: в каждом короткое объяснение, примеры и вопрос на проверку.</p><button type="button" class="btn sm${st.d?' ghost':''}">${st.d?'Пройти ещё раз':st.s?`Продолжить с шага ${st.s+1}`:'Начать разбор'}</button>`;
    $('button',bar).addEventListener('click',()=>openGuide(r,st.d?0:st.s||0));
    return bar;
  }
  function openGuide(r,i){
    const sec=root&&$(`#${r.id}`,root);if(!sec)return;
    let p=$('.guide',sec);
    if(!p){p=el('section','guide');p.setAttribute('aria-label',`Разбор по шагам: ${r.cz}`);const b=$('.gbar',sec);if(b)b.replaceWith(p);else $('.rhead',sec).after(p)}
    guideStep(r,p,i);
  }
  function closeGuide(r){
    const p=root&&$(`#${r.id} .guide`,root);if(!p)return;
    const b=guideBar(r);p.replaceWith(b);$('button',b).focus({preventScroll:true});
  }
  function guideStep(r,p,i){
    const g=GUIDES[r.id],s=g[i],n=g.length,st=gstate[r.id]=gstate[r.id]||{};
    st.s=Math.max(st.s||0,i);store.set(KEYS.guide,gstate);
    p.innerHTML=`<div class="ghead"><h3 tabindex="-1">Шаг ${i+1} из ${n}. ${esc(s.t)}</h3><button type="button" class="linkbtn" data-g="close">Свернуть</button></div>
      <div class="gprog">${g.map((x,j)=>`<button type="button" data-g="${j}" class="${j<i||st.d?'done':''}${j===i?' cur':''}" aria-label="Шаг ${j+1}: ${esc(x.t)}"${j===i?' aria-current="step"':''}><i></i></button>`).join('')}</div>
      <div class="gbody">${s.h}</div>`;
    if(s.x)p.appendChild(renderItem(s.x,'',`g${i}-`,true,true));
    p.appendChild(el('div','gnav',`${i?'<button type="button" class="btn ghost" data-g="prev">Назад</button>':'<span></span>'}<button type="button" class="btn" data-g="next">${i<n-1?'Дальше':'Готово, к упражнениям'}</button>`));
    p.onclick=e=>{
      const b=e.target.closest('[data-g]');if(!b||!p.contains(b))return;
      const a=b.dataset.g;
      if(a==='close')closeGuide(r);
      else if(a==='prev')guideStep(r,p,i-1);
      else if(a==='next'){if(i<n-1)guideStep(r,p,i+1);else finishGuide(r)}
      else guideStep(r,p,+a);
    };
    const top=p.getBoundingClientRect().top;
    if(top<0||top>innerHeight*.5)p.scrollIntoView({block:'start',behavior:motionOK()?'smooth':'auto'});
    $('h3',p).focus({preventScroll:true});
  }
  // the walkthrough ends where practice starts: at the rule's first exercise not solved yet
  function finishGuide(r){
    gstate[r.id]=Object.assign(gstate[r.id]||{},{d:1});store.set(KEYS.guide,gstate);
    closeGuide(r);
    const ex=$(`#${r.id} .exwrap`,root);if(!ex)return;
    ex.scrollIntoView({block:'start',behavior:motionOK()?'smooth':'auto'});
    const f=$('.item:not(.is-done) input,.item:not(.is-done) .opt,.item:not(.is-done) .chip,.item:not(.is-done) .mbtn',ex);
    if(f)f.focus({preventScroll:true});
    announce('Разбор пройден, дальше упражнения правила');
  }
  // from a wrong answer straight to the walkthrough of its rule
  function openGuideById(rid){
    const r=cur&&cur.rules.find(x=>x.id===rid);if(!r)return;
    const st=gstate[rid]||{};openGuide(r,st.d?0:st.s||0);
  }

  // an exercise solved earlier opens with its answer filled in; "Решить ещё раз" brings back the empty one
  function renderSolved(x,num,pfx,card,body){
    card.classList.add('ok');
    const ans=x.t==='c'?x.o[x.a]:x.t==='i'?x.a[0]:x.a;
    const fill=`<span class="filled">${esc(ans)}</span>`;
    const q=x.t==='m'?x.p.map(p=>`<i>${esc(p[0])}</i> — ${esc(p[1])}`).join(', ')
      :x.t==='o'?fill
      :x.q.includes('___')?x.q.replace(/___/g,fill):`${x.q} ${fill}`;
    body.appendChild(el('div','q',q));
    if(x.e)body.appendChild(el('div','solved-note',x.e));
    const row=el('div','row');
    const again=el('button','btn ghost sm','Решить ещё раз');again.type='button';
    again.addEventListener('click',()=>{const nc=renderItem(x,num,pfx,true);card.replaceWith(nc);const f=$('input,.opt,.chip,.mbtn',nc);if(f)f.focus()});
    row.appendChild(again);body.appendChild(row);
    return card;
  }

  // guide: a check question inside «Разбор по шагам», outside the exercise count and the mistake log
  function renderItem(x,num,pfx,fresh,guide){
    // an exercise missed last time opens empty again, marked so the learner knows why
    const weak=!guide&&weakEx(x.id);
    const card=el('div','item'+(!guide&&done.has(x.id)&&!weak?' is-done':''));
    card.appendChild(el('div','n',String(num)));
    const body=el('div','ibody');card.appendChild(body);
    body.appendChild(el('div','kind',`<span>${guide?'Проверьте себя: '+KIND[x.t].toLowerCase():KIND[x.t]}</span>${weak?'<span class="was">в прошлый раз с ошибкой</span>':''}<span class="solved">${ICON.check}${guide?'верно':'решено'}</span>`));
    if(!guide&&!fresh&&done.has(x.id)&&!weak)return renderSolved(x,num,pfx,card,body);
    // the first answer given in this card goes to the log the mixed training reads
    let first=true;
    const rid=x.id.replace(/[xg]\d+$/,'');
    const res=(ok,firstOk=ok)=>{
      if(first){first=false;if(!guide){logEx(x.id,firstOk);refresh()}}
      mark(x,card,ok,!guide);
      // a mistake in a rule that has a walkthrough points to it
      if(!ok&&!guide&&GUIDES[rid]&&!$('.glink',fb)){
        const b=el('button','linkbtn glink','Разобрать правило по шагам');b.type='button';
        b.addEventListener('click',()=>openGuideById(rid));fb.appendChild(b);
      }
    };
    const fb=el('div','fb');fb.setAttribute('aria-live','polite');fb.tabIndex=-1;
    const extra=()=>x.e?` <span class="ex">${x.e}</span>`:'';
    const qid=`q-${pfx}${x.id}`;
    // a question asked in Russian is set in the interface face; Czech inside it stays in <i>
    const question=()=>{const q=el('div','q'+(/^[«"(]?[А-Яа-яЁё]/.test(x.q)?' ru':''),qHTML(x.q));q.id=qid;body.appendChild(q)};

    if(x.t==='c'){
      question();
      const row=el('div','row');row.setAttribute('role','group');row.setAttribute('aria-labelledby',qid);
      x.o.forEach((o,i)=>{
        const b=el('button','opt'+(/[А-Яа-яЁё]/.test(o)?' ru':''),esc(o));b.type='button';
        b.addEventListener('click',()=>{
          $$('.opt',row).forEach(z=>{z.disabled=true});
          row.children[x.a].classList.add('right');
          if(i===x.a){fb.className='fb ok';fb.innerHTML=`${ICON.check}Верно.${extra()}`;res(true);fb.focus({preventScroll:true});return}
          b.classList.add('wrong');fb.className='fb bad';
          fb.innerHTML=`${ICON.cross}Неверно. Правильно: <i>${esc(x.o[x.a])}</i>.${extra()}`;
          res(false);
          const again=el('button','btn ghost sm','Ещё раз');again.type='button';
          again.addEventListener('click',()=>{const nc=renderItem(x,num,pfx,true,guide);card.replaceWith(nc);const f=$('.opt',nc);if(f)f.focus()});
          fb.appendChild(again);again.focus({preventScroll:true});
        });
        row.appendChild(b);
      });
      body.appendChild(row);
    }

    if(x.t==='i'){
      question();
      const row=el('div','row');
      const inp=el('input','ans');inp.type='text';inp.id=`in-${pfx}${x.id}`;inp.autocomplete='off';inp.spellcheck=false;
      inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');inp.setAttribute('aria-labelledby',qid);
      const chk=el('button','btn','Проверить');chk.type='button';
      const show=el('button','btn ghost','Показать ответ');show.type='button';show.hidden=true;
      const check=()=>{
        const v=inp.value;if(!v.trim()){inp.focus();return}
        if(x.a.some(a=>norm(a)===norm(v))){fb.className='fb ok';fb.innerHTML=`${ICON.check}Верно.${extra()}`;res(true);show.hidden=true}
        else if(x.a.some(a=>flat(a)===flat(v))){fb.className='fb warn';fb.innerHTML='Почти: проверьте диакритику (háček, čárka, kroužek).';res(false);card.classList.add('near');show.hidden=false}
        else{fb.className='fb bad';fb.innerHTML='Неверно, попробуйте ещё раз.';res(false);show.hidden=false}
      };
      chk.addEventListener('click',check);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
      show.addEventListener('click',()=>{fb.className='fb bad';fb.innerHTML=`Ответ: <i>${x.a.map(esc).join('</i> или <i>')}</i>.${extra()}`;show.hidden=true;inp.focus()});
      row.append(inp,chk,show);body.appendChild(row);
    }

    if(x.t==='o'){
      const words=x.a.split(' ');
      let order=shuffle(words.map((w,i)=>i));
      if(words.length>1)while(order.every((v,i)=>v===i))order=shuffle(order);
      const ans=el('div','chips'),pool=el('div','chips pool');
      ans.setAttribute('aria-label','Ваш ответ');pool.setAttribute('aria-label','Слова для ответа');
      const picked=[];
      const check=()=>{
        if(norm(picked.map(i=>words[i]).join(' '))===norm(x.a)){fb.className='fb ok';fb.innerHTML=`${ICON.check}Верно: <i>${esc(x.a)}</i>${extra()}`;res(true)}
        else{fb.className='fb bad';fb.innerHTML='Порядок неверный. Нажмите на слово в ответе, чтобы вернуть его.';res(false)}
      };
      const draw=(focusTo)=>{
        ans.innerHTML='';pool.innerHTML='';
        picked.forEach((wi,k)=>{const c=el('button','chip',esc(words[wi]));c.type='button';c.addEventListener('click',()=>{const kb=card.contains(document.activeElement);picked.splice(k,1);fb.className='fb';fb.innerHTML='';draw(kb?'ans':null)});ans.appendChild(c)});
        order.filter(wi=>!picked.includes(wi)).forEach(wi=>{const c=el('button','chip',esc(words[wi]));c.type='button';c.addEventListener('click',()=>{const kb=card.contains(document.activeElement);picked.push(wi);draw(kb?'pool':null);if(picked.length===words.length)check()});pool.appendChild(c)});
        if(!picked.length)ans.innerHTML='<span class="placeholder">Нажимайте на слова по порядку</span>';
        if(focusTo){const f=focusTo==='pool'?($('.chip',pool)||$('.chip:last-child',ans)):($('.chip:last-child',ans)||$('.chip',pool));if(f)f.focus({preventScroll:true})}
      };
      const row=el('div','row');
      const rs=el('button','btn ghost','Сбросить');rs.type='button';rs.addEventListener('click',()=>{picked.length=0;fb.className='fb';fb.innerHTML='';draw()});
      const sh=el('button','btn ghost','Показать ответ');sh.type='button';sh.addEventListener('click',()=>{fb.className='fb bad';fb.innerHTML=`Ответ: <i>${esc(x.a)}</i>${extra()}`});
      row.append(rs,sh);draw();body.append(ans,pool,row);
    }

    if(x.t==='m'){
      const wrap=el('div','match'),lc=el('div','colm'),rc=el('div','colm');wrap.append(lc,rc);
      let sel=null,left=x.p.length,slips=0;
      x.p.forEach((p,i)=>{
        const b=el('button','mbtn',esc(p[0]));b.type='button';b.setAttribute('aria-pressed','false');
        b.addEventListener('click',()=>{
          if(b.classList.contains('done'))return;

// ---------- words: learning in portions, flashcards, quiz, writing, list ----------
const Words=(()=>{
  const MODES=[['learn','Учить'],['cards','Карточки'],['quiz','Тест'],['write','Письмо'],['list','Список']];
  const saved=store.get(KEYS.words,null)||{};

  // «Учить» came after the other modes: it opens once, then the trainer remembers whatever the learner picks

  if(ui.pace!=='day')ui.pace='portion'; // «По порциям» or «Урок за день» inside «Учить»
  ui.onlyNew=!!ui.onlyNew;
  const saveUI=()=>store.set(KEYS.words,{v:2,mode:ui.mode,dir:ui.dir,onlyNew:ui.onlyNew,pace:ui.pace});

  const S={lesson:1,deck:[],pos:0,right:0,wrong:0,total:0,flipped:false,answered:false,busy:false,celebrated:false,filter:'',key:''};
  const canSpeak=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance==='function';
  let root=null,stage=null;

  // split a Czech entry into the bare word and its grammar notes
  function split(cz){
    const gram=[];
    let w=cz.replace(/\(([^)]*)\)/g,(m,g)=>{if(/^(F|M|N|Mn|Mž|Ma|M, F|Mž, F|pl\.|impf\.|pf\.|impf\.\/pf\.|adv\.|N, adv\.|Mn, adv\.|F\/N|N pl\., A pl\.|G pl\.|M, N|3\.os\.sg\.)$/.test(g.trim())){gram.push(g);return ''}return m});
    w=w.replace(/,\s*[-‐]á,\s*[-‐]é/g,'').replace(/,\s*[-‐]í,\s*[-‐]í/g,'')
      .replace(/\s+\+\s*A\/k\s+\+\s*D(?=[\s,;\/)]|$)/g,'')
      .replace(/\s+\+\s*(A\/inf\.|inf\.|adv\.|A|G|D|L|I)(?=[\s,;\/)]|$)/g,'')
      .replace(/\s{2,}/g,' ').replace(/\s+([,;])/g,'$1').trim();

  const norm=s=>s.toLowerCase().replace(/[‐–]/g,'-').replace(/[.!?…,;:"«»]/g,' ').replace(/\s+/g,' ').trim();

  // one token with slashes: "Máš/Máte" → Máš, Máte; "děkuji./-uju." → děkuji., děkuju.; "Chtěl/a" → Chtěl, Chtěla
  function altsOf(tok){
    if(!tok.includes('/'))return [tok];
    const parts=tok.split('/').map(p=>p.match(/^(.*?)([.,!?…;:]*)$/)),end=parts[parts.length-1][2],base=parts[0][1];
    return parts.map(([,core,p],i)=>{

  // a phrase with slashes → every full reading: "Máš/Máte pravdu." → Máš pravdu., Máte pravdu.
  function expand(g){
    const parts=g.split('/').map(p=>p.trim());
    // "podívej se/podívejte se": the slash joins whole phrases ending in the same word
    if(parts.length>1&&parts.every(p=>/\s/.test(p))&&new Set(parts.map(p=>p.split(/\s+/).pop())).size===1)return parts;

  }
  // the ways an entry can be written: [{text, acc}], text is shown to the learner, acc holds every accepted spelling
  function forms(cz){
    const {w}=split(cz),list=[];
    const accept=(acc,s,byParts)=>{
      for(const v of [s,s.replace(/\(([^)]*)\)/g,'$1'),s.replace(/\([^)]*\)/g,'')]){

    // «Prší. Pršelo. Bude pršet.» or «Mám volno. Je tady volno?» are different sentences and stay whole
    const sents=w.split(/(?<=[.!?…])\s+(?=\p{Lu})/u),words=s=>new Set(norm(s).split(' '));
    const sub=(a,b)=>[...a].every(t=>b.has(t)),same=sents.length>1&&sents.every(a=>sents.every(b=>sub(words(a),words(b))||sub(words(b),words(a))));
    for(const g of (same?sents:[w]).flatMap(s=>s.split(/\s+\/\s+/))){

  // r: 2 right, 1 right except diacritics, 0 wrong; i: the matched form, -1 when the whole entry was typed as is
  function check(input,cz){
    const a=norm(input),fs=forms(cz);if(!a)return {r:0,i:0,fs};
    const {w}=split(cz);
    if(a===norm(w)||a===norm(w.replace(/\([^)]*\)/g,'')))return {r:2,i:-1,fs};
    let i=fs.findIndex(f=>f.acc.has(a));if(i>=0)return {r:2,i,fs};

  function speak(t){

    try{const u=new SpeechSynthesisUtterance(say);u.lang='cs-CZ';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
  }

  const deckKey=()=>[S.lesson,ui.mode,ui.dir,ui.onlyNew].join('|');
  const back=w=>(ui.mode==='write'||ui.dir==='ru')?w.cz:w.ru;
  const learned=id=>Mem.level(id)>=LEARNED;
  const czBlock=cz=>{const {w,gram}=split(cz);return `<div class="word" lang="cs">${esc(w)}</div>${gram?`<div class="wgram">${esc(gram)}</div>`:''}`};
  const speakBtn=()=>canSpeak?`<button type="button" class="speak" data-act="say" aria-label="Произнести по-чешски" title="Произнести по-чешски">${ICON.speak}</button>`:'';
  const writeHTML=(w,hint)=>`<div class="qcard pop-in"><div class="word ru" id="wr-q">${esc(w.ru)}</div><div class="whint">${hint}</div></div>
        <input type="text" class="wr-input" id="wr-input" lang="cs" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="česky…" aria-labelledby="wr-q">
        <div class="keys" role="group" aria-label="Буквы с диакритикой">${'áčďéěíňóřšťúůýž'.split('').map(c=>`<button type="button" class="key" data-act="key" data-c="${c}">${c}</button>`).join('')}</div>
        <div class="wfb" aria-live="polite"></div>
        <div class="wbtns"><button type="button" class="btn lg ghost" data-act="skip">Не знаю</button><button type="button" class="btn lg" data-act="check">Проверить <kbd>Enter</kbd></button></div>`;
  // ---------- synonyms: words that mean the same are right answers for each other ----------
  // The meanings of an entry are the pieces of its Russian: «Угощайся. / Угощайтесь.» and «Угощайся/Угощайтесь.» both
  // mean угощайся and угощайтесь. Brackets inside a word are optional («прости(те)»), brackets after a space belong
  // to the meaning: «перец (овощ)» is not «перец (специя)», «чешский (язык)» is not «чешский». A question keeps its «?».
  function senses(ru){
    const out=new Set();
    // a slash or a comma inside brackets stays there: «(Что ты сказал / вы сказали?)», «(роман, фильм)»
    const t=ru.replace(/[‐‑]/g,'-').replace(/\([^)]*\)/g,m=>m.replace(/\s+\/\s+/g,'/').replace(/,/g,' '));
    for(const part of t.split(/\s+\/\s+|;/))
      for(const sent of part.split(/(?<=[.!?…])\s+(?=\(?[А-ЯЁA-Z])/)){
        // a sentence keeps its commas («Раздевайтесь, пожалуйста.»), a list of meanings is split at them
        const s=sent.trim(),whole=/^\(?[А-ЯЁA-Z]/.test(s)&&/[.!?…)]$/.test(s)||/\?$/.test(s);
        for(const unit of whole?[s]:s.split(',')){
          const opt=unit.replace(/(?<=[\p{L}-])\([^)]*\)|\([^)]*\)(?=[\p{L}-])/gu,'');
          for(const v of new Set([unit,opt])){
            const c=v.replace(/[()]/g,''),q=/\?\s*$/.test(c);

            const alts=c.includes('/')?[...c.split('/'),...c.trim().split(/\s+/).reduce((o,tk)=>o.flatMap(a=>tk.split('/').map(x=>a?a+' '+x:x)),[''])]:[c];
            for(const a of alts){const m=a.toLowerCase().replace(/ё/g,'е').replace(/[.,!?…:"«»–—]/g,' ').replace(/\s+/g,' ').replace(/^-\s*/,'').trim();if(m)out.add(q?m+' ?':m)}

  }

  // «пока» is ahoj and zatím, «пол» is pohlaví and podlaha, «звонить» is telefonovat and zvonit (a doorbell)
  const AMBIG=new Set('пока,звонить,проводить,узнать,болеть,лучше,предлагать,праздник,пол,дорогой,перемена,ясно,история,место,билет,минута,один,одна,взять,брать,показывать,какой,злой,плохой,немного,достаточно,иди,идите,желать,в центре,это,хороший,пожилой'.split(','));
  // meanings a word has in a sense of its own: přítel is «девушка» as a girlfriend, hezky is «хорошо» as nice weather
  const OWN={'přítel (Mž), přítelkyně (F)':['парень','девушка'],'hezky':['хорошо']};
  // synonyms the Russian does not show: «билет (входной)» is a lístek too

  const MEAN=new Map(),SYN=new Map();
  // an aspect pair «A (impf.) / B (pf.) | a / b» is matched part by part: «sníst / jíst» shares only jíst with «najíst se / jíst»
  function meaning(w){
    let m=MEAN.get(w.id);if(m)return m;

  }
  // the words of every lesson that mean the same as w: [{w, cz}], cz is the matching part of an aspect pair
  function synonyms(w){
    let out=SYN.get(w.id);if(out)return out;
    const me=meaning(w),also=(mx,[a,b])=>me.acc.has(a)&&mx.acc.has(b)||me.acc.has(b)&&mx.acc.has(a);

  }

  // only synonyms from this and earlier lessons are named: the learner has met them

  const writeHint=w=>forms(w.cz).length>1||metSynonyms(w).length?'Напишите по-чешски, хватит одного варианта':'Напишите по-чешски';

  function render(panel,n){
    root=panel;S.lesson=n;stage=null;
    const tool=el('div','wtool',`<div class="modes" role="group" aria-label="Режим тренировки">${MODES.map(([m,t])=>`<button type="button" class="mode" data-act="mode" data-mode="${m}" aria-pressed="${ui.mode===m}">${t}${m==='learn'?'<span class="due" hidden></span>':''}</button>`).join('')}</div><div class="wset"><button type="button" class="btn ghost dirbtn" data-act="dir" title="С какого языка показывать слово"></button><label class="check"><input type="checkbox" id="only-new"> Только невыученные</label></div>`);
    stage=el('div','stage');

  function enter(){

      if(R&&!R.done&&R.ans){R.ans=false;R.pos++;if(R.pos>=R.q.length)R.done=true}

    S.pos=0;S.right=0;S.wrong=0;S.total=S.deck.length;S.flipped=false;S.answered=false;S.celebrated=false;S.key=deckKey();
    renderControls();renderStage();
  }
  function renderControls(){
    if(!root)return;
    $$('.mode',root).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===ui.mode)));
    $('.wset',root).hidden=ui.mode==='learn';
    const d=$('.dirbtn',root);
    d.textContent=ui.mode==='write'?'RU → CZ, ответ по-чешски':(ui.dir==='cz'?'CZ → RU':'RU → CZ');
    d.disabled=ui.mode==='write'||ui.mode==='list';

  }
  // the «Учить» mode carries the number of the lesson's words due today
  function refresh(){
    const b=root&&root.isConnected?$('.mode .due',root):null;if(!b)return;
    const n=wordStat(S.lesson).due;b.hidden=!n;b.innerHTML=`<span class="sr">, на повторение: </span>${n}`;
  }
  function meta(){
    if(ui.mode==='learn'&&R){
      // counted in words, not tasks: a word's later steps and repeats never make the number grow
      const left=new Set(R.q.slice(R.pos).map(t=>t.w)).size,done=R.total-left,p=Math.round(done/R.total*100);
      const sort=R.kind==='sort',check=R.kind==='check'||R.kind==='eve';
      return `<div class="wmeta"><span>Осталось ${nWords(left)}</span><span>${sort?`Знаю ${R.sk}, учить ${R.su}`:`Верно ${R.right}, ошибок ${R.wrong}`}</span><button type="button" class="linkbtn" data-act="lstop">${sort?'Закончить отбор':check?'Закончить проверку':'Закончить порцию'}</button></div><div class="wprog" role="progressbar" aria-label="Слов пройдено" aria-valuemin="0" aria-valuemax="${R.total}" aria-valuenow="${done}"><i style="width:${p}%"></i></div>`;
    }

  // ---------- «Учить»: the lesson's words in portions, with spaced reviews ----------
  // A new word is shown, then picked among four, then written; a mistake brings the task back a few steps later.
  // Words due for review are written from memory first; more than REVIEWS due words make a portion of reviews only.
  // «Урок за день» runs the same tasks as a plan for one day: sort out the words already known, learn the rest,
  // write every word of the lesson, and write them all again at least two hours later (see daySteps).
  // Task kinds: sort, intro, pick, type. A written task's m: new (a word being learned), rev (a scheduled review),

  const when=d=>d===1?'завтра':d===2?'послезавтра':`через ${d} ${plural(d,['день','дня','дней'])}`;
  const clock=ms=>new Date(ms).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  function plan(){
    const ws=lessonWords(),t=today();
    const due=ws.filter(w=>Mem.level(w.id)&&Mem.dueDay(w.id)<=t),fresh=ws.filter(w=>!Mem.level(w.id));
    return {due,fresh,rev:Math.min(due.length,REVIEWS),nw:due.length>REVIEWS?0:Math.min(fresh.length,PORTION)};
  }
  function nextDue(){
    const t=today();let day=Infinity,n=0;
    lessonWords().forEach(w=>{const d=Mem.dueDay(w.id);if(d==null||d<=t)return;if(d<day){day=d;n=1}else if(d===day)n++});
    return day<Infinity?{in:day-t,n}:null;

  function startRound(kind,q){

  }
  function newRound(){
    const p=plan();
    // the most overdue first, then the weakest
    const rev=p.due.sort((a,b)=>Mem.dueDay(a.id)-Mem.dueDay(b.id)||Mem.level(a.id)-Mem.level(b.id)).slice(0,p.rev);
    const a=shuffle(rev).map(w=>({w,k:'type',m:'rev',n:0})),b=shuffle(p.fresh).slice(0,p.nw).map(w=>({w,k:'intro',n:0}));
    const q=[];while(a.length||b.length){if(a.length)q.push(a.shift());if(b.length)q.push(b.shift())}
    startRound('portion',q);
  }

  // ---------- «Урок за день» ----------
  // One state per lesson for the current study day, in cz-a1a2-day: the words in the plan (ids: not learned yet
  // when the day began), the new ones among them (fresh), the sorting (1 «Знаю», 0 «Не знаю»), the order the words
  // were learned in, the words written right in the check (pass) and in the evening (eve), and when the check ended (t).
  function dayState(){
    const all=store.get(KEYS.day,null)||{},t=today();let B=all[S.lesson];
    if(!B||B.d!==t||!Array.isArray(B.ids)||!Array.isArray(B.fresh)||!Array.isArray(B.order)){
      const ws=lessonWords().filter(w=>Mem.level(w.id)<LEARNED);
      B={d:t,ids:ws.map(w=>w.id),fresh:ws.filter(w=>!Mem.level(w.id)).map(w=>w.id),sort:{},order:[],pass:{},eve:{},t:0};
    }
    return B;
  }
  function daySave(B){
    const all=store.get(KEYS.day,null)||{};
    for(const k of Object.keys(all))if(!all[k]||all[k].d!==B.d)delete all[k]; // yesterday's plans are over
    all[S.lesson]=B;store.set(KEYS.day,all);
  }
  function daySteps(B){
    const byId=new Map(lessonWords().map(w=>[w.id,w])),has=id=>byId.has(id);
    const ids=B.ids.filter(has);
    const toSort=B.fresh.filter(id=>has(id)&&!(id in B.sort)&&!Mem.level(id));
    const sorted=B.fresh.filter(id=>has(id)&&id in B.sort);
    const toLearn=sorted.filter(id=>B.sort[id]===0&&!Mem.level(id));
    const toCheck=ids.filter(id=>!B.pass[id]),toEve=ids.filter(id=>!B.eve[id]);
    const evAt=B.t?B.t+EVENING:0;
    const step=!ids.length?4:toSort.length?0:toLearn.length?1:toCheck.length?2:toEve.length?3:4;
    return {byId,ids,toSort,sorted,toLearn,toCheck,toEve,evAt,step};
  }
  function dayRound(){
    const B=dayState(),st=daySteps(B),w=id=>st.byId.get(id);
    daySave(B); // the plan is fixed from the first round of the day
    if(st.step===0)startRound('sort',st.toSort.map(id=>({w:w(id),k:'sort'})));
    else if(st.step===1)startRound('learn',shuffle(st.toLearn).slice(0,DAY_WAVE).map(id=>({w:w(id),k:'intro',n:0})));
    else if(st.step===2){
      // the words met earlier go first and the freshly learned ones follow in the order they were learned,
      // so every word gets a pause before it has to be recalled
      const learnt=B.order.filter(id=>st.toCheck.includes(id)),rest=shuffle(st.toCheck.filter(id=>!B.order.includes(id)));
      startRound('check',[...rest,...learnt].slice(0,DAY_CHECK).map(id=>({w:w(id),k:'type',m:'chk',n:0,day:'check'})));
    }
    else if(st.step===3&&Date.now()>=st.evAt)startRound('eve',shuffle(st.toEve).slice(0,DAY_CHECK).map(id=>({w:w(id),k:'type',m:'eve',n:0,day:'eve'})));
    else startRound('eve',[]);
  }
  // a word finished a day step: written right in the check or in the evening
  function dayPass(day,id){
    const B=dayState();
    if(day==='check'){B.pass[id]=1;if(!B.t&&!daySteps(B).toCheck.length)B.t=Date.now()}
    else B.eve[id]=1;
    daySave(B);
  }
  function dayLearnt(id){const B=dayState();if(!B.order.includes(id)){B.order.push(id);daySave(B)}}
  // a word missed at its first attempt in the check (cmiss) or in the evening (emiss)
  function dayMiss(day,id){const B=dayState(),k=day==='check'?'cmiss':'emiss';B[k]=B[k]||{};B[k][id]=1;daySave(B)}
  function sortAnswer(v){
    const task=curTask();if(!task||task.k!=='sort')return;
    const B=dayState();B.sort[task.w.id]=v;daySave(B);
    if(v)R.sk++;else R.su++;
    nextTask();
  }
  function sortShow(){
    const task=curTask(),box=$('.sortcz',stage);if(!task||task.k!=='sort'||!box||!box.hidden)return;
    box.hidden=false;const b=$('[data-act="lshow"]',stage);if(b)b.hidden=true;
    speak(task.w.cz);
    $('[data-act="lsort"][data-v="0"]',stage).focus({preventScroll:true});
  }

  // put a task back into the round, gap tasks later (at the end when the round is short)
  const later=(task,gap)=>R.q.splice(Math.min(R.q.length,R.pos+1+gap),0,task);
  const curTask=()=>R&&!R.done&&R.lesson===S.lesson?R.q[R.pos]:null;
  const curWord=()=>ui.mode==='learn'?(curTask()||{}).w:S.deck[S.pos];
  function nextTask(){
    if(!R||R.done)return;
    R.pos++;R.ans=false;
    if(R.pos>=R.q.length)finishRound();else renderLearn(true);
  }
  function finishRound(){
    R.done=true;
    const s=wordStat(S.lesson);
    if(R.kind==='eve'&&daySteps(dayState()).step===4){confetti();announce('Урок за день пройден')}
    else if(s.total&&s.done===s.total&&R.changed.size){confetti();announce(`Все слова урока ${S.lesson} выучены`)}
    else announce(R.kind==='sort'?'Отбор пройден':R.kind==='check'||R.kind==='eve'?'Проверка пройдена':'Порция пройдена');
    refreshProgress();renderLearn(true);
  }
  function renderLearn(keepFocus){
    if(!stage||!stage.isConnected)return;
    if(R&&R.lesson!==S.lesson)R=null;
    const focus=keepFocus||stage.contains(document.activeElement);
    const task=curTask();
    if(!task)return learnHome(focus);
    const w=task.w;
    if(task.k==='sort'){
      stage.innerHTML=meta()+`<div class="qcard pop-in"><div class="word ru" id="lq">${esc(w.ru)}</div><div class="whint">Знаете, как это по-чешски?</div><div class="sortcz" hidden>${czBlock(w.cz)}${speakBtn()}</div><button type="button" class="btn sm ghost" data-act="lshow">Показать <kbd>Пробел</kbd></button></div>
        <div class="wbtns"><button type="button" class="btn lg bad" data-act="lsort" data-v="0">${ICON.cross}Не знаю <kbd>1</kbd></button><button type="button" class="btn lg good" data-act="lsort" data-v="1">${ICON.check}Знаю <kbd>2</kbd></button></div>`;
      if(focus)$('[data-act="lshow"]',stage).focus({preventScroll:true});
    }else if(task.k==='intro'){
      const {w:cw,gram}=split(w.cz);
      stage.innerHTML=meta()+`<div class="icard pop-in"><div class="word" lang="cs" id="lq">${esc(cw)}</div>${gram?`<div class="wgram">${esc(gram)}</div>`:''}<div class="answer">${esc(w.ru)}</div><div class="whint">Новое слово. Послушайте и запомните</div>${speakBtn()}</div>
        <div class="wbtns">${task.day?'':'<button type="button" class="btn lg ghost" data-act="lknow">Уже знаю</button>'}<button type="button" class="btn lg" data-act="lnext">Дальше <kbd>Enter</kbd></button></div>`;
      speak(w.cz);
      if(focus)$('[data-act="lnext"]',stage).focus({preventScroll:true});
    }else if(task.k==='pick'){
      if(!task.opts){const cw=split(w.cz).w,pool=lessonWords().filter(x=>split(x.cz).w!==cw&&!confusable(w,x));task.opts=shuffle([w,...shuffle(pool).slice(0,3)])}
      stage.innerHTML=meta()+`<div class="qcard pop-in"><div class="word ru" id="lq">${esc(w.ru)}</div><div class="whint">Выберите, как это по-чешски</div></div>
        <div class="wopts" role="group" aria-labelledby="lq">${task.opts.map((o,i)=>`<button type="button" class="wopt cz" data-act="lpick" data-i="${i}" lang="cs"><kbd>${i+1}</kbd><span>${esc(split(o.cz).w)}</span></button>`).join('')}</div>
        <div class="wbtns" hidden><button type="button" class="btn lg" data-act="lnext">Дальше <kbd>Enter</kbd></button></div>`;
      if(focus)$('.wopt',stage).focus({preventScroll:true});
    }else{
      const lead=task.m==='rev'?'Повторение. ':task.day==='check'?'Проверка. ':task.day==='eve'?'Вечерняя проверка. ':'';
      stage.innerHTML=meta()+writeHTML(w,lead+writeHint(w));
      setTimeout(()=>{const i=$('#wr-input',stage);if(i&&i.isConnected)i.focus({preventScroll:true})},30);
    }
  }

  // the lesson's words as squares, a legend, and the pace switch: the top of both «Учить» screens
  function homeTop(res,anim){
    const ws=lessonWords(),t=today(),s=wordStat(S.lesson),fresh=s.total-s.done-s.learning;
    let k=0;
    const cells=ws.map(w=>{
      const l=Mem.level(w.id),c=[l>=LEARNED?'k':l?'l':'',l&&Mem.dueDay(w.id)<=t?'d':''];let st='';
      if(anim&&res.changed.has(w.id)){c.push('up');st=` style="animation-delay:${Math.min(k++*30,900)}ms"`}
      return `<i class="${c.filter(Boolean).join(' ')}"${st}></i>`;
    }).join('');
    return `<div class="pace" role="group" aria-label="Темп">${[['portion','По порциям'],['day','Урок за день']].map(([p,t])=>`<button type="button" data-act="pace" data-pace="${p}" aria-pressed="${ui.pace===p}">${t}</button>`).join('')}</div>
      <div class="wmap" aria-hidden="true">${cells}</div>
      <ul class="wleg"><li><i class="k"></i>Выучено <b>${s.done}</b></li><li><i class="l"></i>Учатся <b>${s.learning}</b></li><li><i></i>Новые <b>${fresh}</b></li>${s.due?`<li><i class="d"></i>Повторить сейчас <b>${s.due}</b></li>`:''}</ul>`;
  }
  // what the last round did, shown once right after it ends
  function roundSummary(res){
    if(res.kind==='sort')return `Отбор: знаю ${res.sk}, учить ${res.su}.`;
    if(res.kind==='check'||res.kind==='eve')return `${res.kind==='eve'?'Вечерняя проверка':'Проверка'}: в этой части без ошибок ${res.firstOk} из ${res.first}.`+(res.learnt?` Выучено заново: ${res.learnt}.`:'');
    return [
      res.learnt||res.rev||res.known?'Порция пройдена.':'Порция закончена, слова остались на прежних местах.',
      res.learnt&&`Новых слов: ${res.learnt}.`,
      res.rev&&`Повторено: ${res.rev}`+(res.revBad?`, с ошибкой ${res.revBad}.`:'.'),
      res.known&&`Отмечено «Уже знаю»: ${res.known}.`
    ].filter(Boolean).join(' ');
  }
  function learnHome(focus){
    const res=R&&R.done?R:null,anim=res&&!res.shown;if(res)res.shown=true;
    const body=ui.pace==='day'?dayHome(anim?roundSummary(res):''):portionHome(anim?roundSummary(res):'');
    stage.innerHTML=`<div class="lhome">${homeTop(res,anim)}${body}</div>`;
    if(focus){const f=$('.wbtns .btn:not(:disabled)',stage)||$('.pace [aria-pressed="true"]',stage);if(f)f.focus({preventScroll:true})}
  }
  function portionHome(summary){
    const s=wordStat(S.lesson),p=plan(),lines=[summary];
    if(!s.done&&!s.learning)lines.push(`В уроке ${nWords(s.total)}. Каждое новое слово вы сначала видите и слышите, потом выбираете из четырёх вариантов и пишете по-чешски.`);
    else if(p.due.length)lines.push(`Сейчас на повторение ${nWords(p.due.length)}.`);
    else{
      const nd=nextDue();
      lines.push((s.done===s.total?'Все слова урока выучены. ':!p.fresh.length?'Все слова урока в работе. ':'')+(nd?`Следующее повторение ${when(nd.in)}: ${nWords(nd.n)}.`:''));
    }
    const a=p.rev,b=p.nw;
    const cta=a&&b?`Повторить ${a} и выучить ${b} ${plural(b,['новое','новых','новых'])}`
      :a?`Повторить ${nWords(a)}`:b?`Выучить ${b} ${plural(b,['новое слово','новых слова','новых слов'])}`:'';
    return `${lines.filter(Boolean).map(l=>`<p class="lnote">${l}</p>`).join('')}
      <div class="wbtns">${cta?`<button type="button" class="btn lg" data-act="lstart">${cta}</button>`:'<button type="button" class="btn lg ghost" data-act="mode" data-mode="write">Повторить всё письменно</button>'}</div>
      <details class="how"><summary>${ICON.chev}Как это работает</summary><ul>
        <li>Новые слова идут порциями по 10. Слово сначала показывается, потом его нужно узнать среди четырёх вариантов и написать по-чешски.</li>
        <li>Ошибка возвращает задание через пару шагов, пока вы не ответите правильно.</li>
        <li>Потом слово приходит на повторение через 1, 2 и 4 дня, дальше через неделю, две, месяц и два. Повторяете письменно, и повторения идут раньше новых слов.</li>
        <li>Слово выучено, когда вы правильно написали его в два разных дня. Ошибка при повторении возвращает его в «Учатся».</li>
        <li>Карточки, тест и письмо остаются свободной практикой. Ошибка там тоже отправляет слово на повторение.</li>
        <li>Если урок нужно выучить быстро, переключитесь на «Урок за день».</li>
      </ul></details>`;
  }
  function dayHome(summary){
    const B=dayState(),st=daySteps(B),now=Date.now(),n=st.ids.length;
    const known=st.sorted.filter(id=>B.sort[id]===1).length,learnAll=st.sorted.filter(id=>B.sort[id]===0).length;
    const lines=[summary];
    let cta='',wait=false;
    if(!n)lines.push('Все слова урока уже выучены, учить за день нечего. Повторения идут своим чередом в режиме «По порциям».');
    else if(st.step===4)lines.push('Урок за день пройден. Слова, написанные вечером без ошибки, выучены и придут на контрольное повторение через 2 дня, остальные вернутся завтра.');
    else{
      if(st.step===0)cta=`${st.sorted.length?'Продолжить':'Начать'} отбор: ${nWords(st.toSort.length)}`;
      else if(st.step===1)cta=`Учить ${Math.min(DAY_WAVE,st.toLearn.length)} из ${ofWords(st.toLearn.length)}`;
      else if(st.step===2)cta=`${st.toCheck.length<n?'Продолжить':'Начать'} проверку: ${nWords(st.toCheck.length)}`;
      else if(now<st.evAt){cta=`Вечерняя проверка в ${clock(st.evAt)}`;wait=true}
      else cta=`Вечерняя проверка: ${nWords(st.toEve.length)}`;
      if(st.step<3){
        const min=x=>{const m=Math.max(5,Math.round(x/300)*5);return `${m} ${plural(m,['минута','минуты','минут'])}`};
        // before sorting, about two words in three are taken as unknown
        const toLearn=st.toLearn.length+Math.round(st.toSort.length*.7);
        lines.push(`Осталось примерно ${min(st.toSort.length*3+toLearn*15+st.toCheck.length*7)} работы и около ${min(st.toEve.length*7)} вечером. Прогресс сохраняется до конца дня, можно прерываться.`);
      }else if(wait)lines.push(`Проверка пройдена. Сделайте перерыв: вечерняя проверка откроется в ${clock(st.evAt)}. Лучше всего пройти её перед сном, во сне слова закрепляются.`);
    }
    const missed=k=>{const m=Object.keys(B[k]||{}).length;return m?`, с ошибкой ${m}`:''};
    const steps=[
      ['Отбор','Отметьте слова, которые уже знаете: их не нужно учить',st.toSort.length?`осталось ${st.toSort.length} из ${st.toSort.length+st.sorted.length}`:`знаю ${known}, учить ${learnAll}`],
      ['Заучивание',`Остальные слова порциями по ${DAY_WAVE}: показ, выбор, письмо`,st.step===0?'после отбора':learnAll?`выучено ${learnAll-st.toLearn.length} из ${learnAll}`:'учить нечего'],
      ['Проверка','Все слова урока письменно, с паузой после изучения',`написано ${n-st.toCheck.length} из ${n}`+missed('cmiss')],
      ['Вечером','Ещё раз все слова, не раньше чем через 2 часа',st.step<3?'через 2 часа после проверки':now<st.evAt&&st.step===3?`откроется в ${clock(st.evAt)}`:`написано ${n-st.toEve.length} из ${n}`+missed('emiss')]
    ];
    const list=n?`<ol class="steps" aria-label="План на день">${steps.map(([t,d,s],i)=>{const c=i<st.step?'done':i===st.step?'cur':'';
      return `<li class="${c}"${c==='cur'?' aria-current="step"':''}><span class="sn" aria-hidden="true">${c==='done'?ICON.check:i+1}</span><span class="sx"><b>${t}</b><span>${d}</span></span><span class="ss">${c==='done'?'<span class="sr">Готово: </span>':''}${s}</span></li>`}).join('')}</ol>`:'';
    return `${list}${lines.filter(Boolean).map(l=>`<p class="lnote">${l}</p>`).join('')}
      ${cta?`<div class="wbtns"><button type="button" class="btn lg" data-act="lstart"${wait?' disabled':''}>${cta}</button></div>`:''}
      <details class="how"><summary>${ICON.chev}Как это работает</summary><ul>
        <li>Отбор: пролистайте новые слова и отметьте, какие уже знаете. На слово уходит пара секунд, знакомые сразу идут на проверку.</li>
        <li>Заучивание: остальные слова порциями по ${DAY_WAVE}. Каждое показывается, потом его нужно выбрать из четырёх вариантов и написать. Ошибка возвращает слово, пока не ответите правильно.</li>
        <li>Проверка: все слова урока письменно. Сначала знакомые, потом выученные в том порядке, в каком вы их учили, поэтому у каждого слова есть пауза. Вспомнить после паузы труднее, но так слово запоминается крепче.</li>
        <li>Вечером, не раньше чем через 2 часа, все слова ещё раз. Написанные без ошибки становятся выученными и придут на контрольное повторение через 2 дня, слова с ошибками вернутся завтра.</li>
        <li>Прогресс сохраняется до конца дня: можно прерваться и продолжить.</li>
      </ul></details>`;
  }
  function introNext(){
    const task=curTask();if(!task||task.k!=='intro')return;
    later({w:task.w,k:'pick',n:0,day:task.day},2);nextTask();
  }
  function introKnown(){
    const task=curTask();if(!task||task.k!=='intro')return;
    Mem.know(task.w.id);R.known++;R.changed.add(task.w.id);refreshProgress();nextTask();
  }
  function learnPick(i){
    const task=curTask();if(!task||task.k!=='pick'||R.ans||!task.opts[i])return;
    R.ans=true;const w=task.w,ok=task.opts[i]===w;
    $$('.wopt',stage).forEach((b,j)=>{
      b.disabled=true;
      if(task.opts[j]===w){b.classList.add('ok');b.insertAdjacentHTML('beforeend',ICON.check)}
      else if(j===i){b.classList.add('no');b.insertAdjacentHTML('beforeend',ICON.cross)}
    });
    speak(w.cz);
    if(ok){
      R.right++;later({w,k:'type',m:'new',n:0,day:task.day},2);announce('Верно');
      setTimeout(()=>{if(ui.mode==='learn'&&curTask()===task&&stage&&stage.isConnected)nextTask()},650);
      return;
    }
    R.wrong++;if(task.n<2)later({w,k:'pick',n:task.n+1,day:task.day},2);
    announce(`Неверно. Правильно: ${split(w.cz).w}`);
    const nb=$('.wbtns',stage);nb.hidden=false;$('button',nb).focus({preventScroll:true});
  }
  // a written answer: reviews move on the schedule, new words become «Учатся» when written right,
  // the day checks count the first attempt and repeat a word until it is written right
  function learnTyped(res){
    const task=curTask(),w=task.w,id=w.id,ok=res==='ok';
    if(ok)R.right++;else R.wrong++;
    const again=()=>later({w,k:'type',m:'again',n:task.n+1,day:task.day},3);
    const finish=()=>{if(task.day)dayPass(task.day,id)};
    if(task.m==='rev'){
      R.rev++;Mem.answer(id,res);R.changed.add(id);
      if(!ok){R.revBad++;again()}
    }else if(task.m==='chk'||task.m==='eve'){
      R.first++;
      if(!ok)dayMiss(task.day,id);
      if(ok){
        R.firstOk++;
        if(task.m==='eve')Mem.promote(id);else if(Mem.level(id))Mem.answer(id,'ok');else Mem.learnt(id);
        R.changed.add(id);finish();
      }else if(task.m==='chk'&&!Mem.level(id)&&res==='fail'){
        // a word sorted as known turned out unknown: it gets the intro, the choice and the writing
        later({w,k:'intro',n:0,day:task.day},1);
      }else{
        if(Mem.level(id)){Mem.answer(id,res);R.changed.add(id)}
        again();
      }
    }else if(ok){
      if(task.m==='new'){Mem.learnt(id);R.learnt++;R.changed.add(id);if(R.kind==='learn')dayLearnt(id)}
      else if(!Mem.level(id)){Mem.learnt(id);R.learnt++;R.changed.add(id)}
      finish();
    }else if(task.n<3)later({...task,n:task.n+1},3);
    refreshProgress();
  }

  function renderStage(keepFocus){
    if(!stage||!stage.isConnected)return;
    if(ui.mode==='list')return renderList();
    if(ui.mode==='learn')return renderLearn(keepFocus);
    const focusBack=keepFocus||stage.contains(document.activeElement);
    if(!S.total){
      stage.innerHTML=`<div class="result"><div class="big">${ICON.check}</div><p>В этом уроке все слова отмечены как выученные.</p><div class="row center"><button type="button" class="btn lg" data-act="all">Тренировать все слова</button><button type="button" class="btn lg ghost" data-act="reset">Сбросить прогресс урока</button></div></div>`;
      if(focusBack)focusStage();return;
    }
    if(S.pos>=S.deck.length){
      const acc=Math.round(S.right/(S.right+S.wrong||1)*100);
      stage.innerHTML=`<div class="result"><p class="rlabel">Урок ${S.lesson} пройден</p><div class="big">${acc}%</div><p>Верно с первого раза или после повтора: ${S.right} из ${S.total}. Ошибок по ходу: ${S.wrong}.</p><div class="row center"><button type="button" class="btn lg" data-act="again">Ещё раз</button>${S.lesson<LAST?`<a class="btn lg ghost" href="${hashFor(S.lesson+1,'slova')}">Урок ${S.lesson+1}</a>`:''}</div></div>`;
      if(!S.celebrated){S.celebrated=true;confetti();announce(`Урок ${S.lesson} пройден, точность ${acc}%`)}
      if(focusBack)focusStage();return;
    }
    const w=S.deck[S.pos];
    if(ui.mode==='cards'){
      const czFront=ui.dir==='cz';
      const {w:cw,gram}=split(w.cz);
      const frontHTML=czFront?czBlock(w.cz):`<div class="word ru">${esc(w.ru)}</div>`;
      const backHTML=czFront
        ?`<div class="qline cz" lang="cs">${esc(cw)}</div><div class="answer">${esc(w.ru)}</div>`
        :`<div class="qline">${esc(w.ru)}</div><div class="answer cz" lang="cs">${esc(cw)}</div>${gram?`<div class="wgram">${esc(gram)}</div>`:''}`;
      stage.innerHTML=meta()+`<div class="flash pop-in${S.flipped?' flipped':''}" tabindex="0" role="button" aria-describedby="flash-hint"><div class="inner">
        <div class="face front" aria-hidden="${S.flipped}">${frontHTML}<div class="whint" id="flash-hint">Нажмите на карточку<span class="kb-only"> или пробел</span>, чтобы перевернуть</div></div>
        <div class="face back" aria-hidden="${!S.flipped}">${backHTML}<div class="whint touch-only">Свайп вправо — знаю, влево — не знаю</div></div>
        <div class="tint"></div></div></div><div class="wbtns"></div>`;
      cardButtons();bindSwipe();
    }else if(ui.mode==='quiz'){
      if(!w.opts){const pool=(WORDS[S.lesson]||[]).filter(x=>back(x)!==back(w)&&!confusable(w,x));w.opts=shuffle([w,...shuffle(pool).slice(0,3)])}
      const czOpts=ui.dir==='ru';
      stage.innerHTML=meta()+`<div class="qcard pop-in">${ui.dir==='cz'?czBlock(w.cz):`<div class="word ru">${esc(w.ru)}</div>`}${speakBtn()}</div>
        <div class="wopts" role="group" aria-label="Варианты перевода">${w.opts.map((o,i)=>`<button type="button" class="wopt${czOpts?' cz':''}" data-act="pick" data-i="${i}"${czOpts?' lang="cs"':''}><kbd>${i+1}</kbd><span>${esc(czOpts?split(o.cz).w:o.ru)}</span></button>`).join('')}</div>`;
    }else if(ui.mode==='write'){
      stage.innerHTML=meta()+writeHTML(w,writeHint(w));
      setTimeout(()=>{const i=$('#wr-input',stage);if(i&&i.isConnected)i.focus({preventScroll:true})},30);
      return;
    }
    if(focusBack)focusStage();
  }
  function focusStage(){const f=$('.flash',stage)||$('.wopt',stage)||$('.result .btn',stage);if(f)f.focus({preventScroll:true})}
  function cardButtons(){
    const r=$('.wbtns',stage);if(!r)return;
    r.innerHTML=(S.flipped
      ?`<button type="button" class="btn lg bad" data-act="no">${ICON.cross}Не знаю <kbd>1</kbd></button><button type="button" class="btn lg good" data-act="yes">${ICON.check}Знаю <kbd>2</kbd></button>`
      :`<button type="button" class="btn lg" data-act="flip">Показать перевод</button>`)+speakBtn();
  }
  function flip(){
    if(ui.mode!=='cards'||S.pos>=S.deck.length)return;
    const c=$('.flash',stage);if(!c)return;
    S.flipped=!S.flipped;c.classList.toggle('flipped',S.flipped);
    $('.face.front',c).setAttribute('aria-hidden',String(S.flipped));$('.face.back',c).setAttribute('aria-hidden',String(!S.flipped));
    cardButtons();
    if(S.flipped){const w=S.deck[S.pos];announce(ui.dir==='cz'?w.ru:split(w.cz).w);if(ui.dir==='ru')speak(w.cz)}
  }
  function swipeMark(ok){
    if(S.busy||!S.flipped)return;
    const c=$('.flash',stage),keep=stage.contains(document.activeElement);
    if(!c||!motionOK()){mark(ok,keep);return}
    S.busy=true;c.style.transform='';c.classList.remove('drag');c.classList.add(ok?'out-r':'out-l');
    setTimeout(()=>{S.busy=false;mark(ok,keep)},300);
  }
  function bindSwipe(){
    const c=$('.flash',stage);if(!c)return;
    let x0=null,dx=0,moved=false;
    c.addEventListener('pointerdown',e=>{if(e.button>0)return;x0=e.clientX;dx=0;moved=false;try{c.setPointerCapture(e.pointerId)}catch(_){}});
    c.addEventListener('pointermove',e=>{
      if(x0==null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;if(!moved||!S.flipped)return;
      c.classList.add('drag');c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
      const t=$('.tint',c);t.style.opacity=Math.min(Math.abs(dx)/140,.35);t.style.background=dx>0?'var(--good)':'var(--red)';
    });
    const end=cancel=>{
      if(x0==null)return;x0=null;
      if(!cancel&&!moved){flip();return}
      if(!cancel&&S.flipped&&Math.abs(dx)>90){swipeMark(dx>0);return}
      c.classList.remove('drag');c.style.transition='transform .3s';c.style.transform='';
      const t=$('.tint',c);if(t)t.style.opacity=0;setTimeout(()=>{c.style.transition=''},300);
    };
    c.addEventListener('pointerup',()=>end(false));
    c.addEventListener('pointercancel',()=>end(true));
  }
  // free practice feeds the same memory: a mistake sends the word to review tomorrow,
  // a right answer counts only when the word is new or due (see Mem.answer)
  function mark(res,keep){
    const w=S.deck[S.pos];if(!w)return;
    const r=res===true?'ok':res===false?'fail':res;
    Mem.answer(w.id,r);
    if(r==='ok')S.right++;
    else{S.wrong++;S.deck.splice(Math.min(S.deck.length,S.pos+4+(Math.random()*3|0)),0,{...w,opts:null})}
    S.pos++;S.flipped=false;S.answered=false;
    refreshProgress();renderStage(keep);
  }
  function quizPick(i){
    if(S.answered||ui.mode!=='quiz')return;
    const w=S.deck[S.pos];if(!w||!w.opts||!w.opts[i])return;
    const keep=stage.contains(document.activeElement);
    S.answered=true;const ok=w.opts[i]===w;
    $$('.wopt',stage).forEach((b,j)=>{
      b.disabled=true;
      if(w.opts[j]===w){b.classList.add('ok');b.insertAdjacentHTML('beforeend',ICON.check)}
      else if(j===i){b.classList.add('no');b.insertAdjacentHTML('beforeend',ICON.cross)}
    });
    announce(ok?'Верно':`Неверно. Правильно: ${ui.dir==='cz'?w.ru:split(w.cz).w}`);
    if(ui.dir==='ru'||ok)speak(w.cz);
    setTimeout(()=>mark(ok,keep),ok?650:1600);
  }
  function writeCheck(skip){
    const learn=ui.mode==='learn',w=curWord(),fb=$('.wfb',stage),inp=$('#wr-input',stage);if(!w||!fb||!inp)return;
    if(learn?R.ans:S.answered){if(learn)nextTask();else mark(fb.dataset.res,true);return}
    if(!skip&&!inp.value.trim()){inp.focus();return}
    // a word that means the same is a right answer too: «спасибо» is děkuji and díky, «врач» is lékař and doktor
    const syn=synonyms(w);
    let c=check(skip?'':inp.value,w.cz),from=null;
    for(const s of syn){if(c.r===2)break;const c2=check(skip?'':inp.value,s.cz);if(c2.r>c.r){c=c2;from=s}}
    const {r,i,fs}=c;
    // diacritics are part of the spelling: a near miss (r===1) counts as a mistake
    const res=r===2?'ok':r===1?'near':'fail';
    if(learn)R.ans=true;else S.answered=true;
    fb.dataset.res=res;
    const {w:whole,gram}=split(from?from.cz:w.cz);
    const word=i<0?whole:fs[i].text;
    const texts=cz=>forms(cz).map(f=>f.text),mine=texts(w.cz);
    const rest=i<0?[]:fs.filter((f,j)=>j!==i).map(f=>f.text); // the other forms of the word that was matched
    const others=metSynonyms(w).filter(s=>s!==from).flatMap(s=>texts(s.cz));
    const walt=(label,list)=>{list=[...new Set(list)].filter(t=>t!==word);return list.length?`<div class="walt"><span class="walt-l">${label}</span>${list.map(t=>`<b lang="cs">${esc(t)}</b>`).join('')}</div>`:''};
    if(r<2){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake')}
    fb.innerHTML=(r===2?`<div class="verdict ok">${ICON.check}<span>Správně! <b lang="cs">${esc(word)}</b></span></div>`
      :`<div class="verdict no">${ICON.cross}<span>${r===1?'Ошибка в диакритике. ':''}Правильно: <b lang="cs">${esc(word)}</b>${gram?`<span class="wgram">${esc(gram)}</span>`:''}</span></div>`)
      // a synonym was written: the word of the task is shown every time, so it is learned as well
      +(from?walt('Это синоним. В задании слово',mine)+walt('Ещё можно сказать',[...rest,...others].filter(t=>!mine.includes(t)))
        :/\(impf\.\)/.test(w.cz)&&/\(pf\.\)/.test(w.cz)?walt('Видовая пара',rest)+walt('Ещё можно сказать',others.filter(t=>!rest.includes(t)))
        :walt('Ещё можно сказать',[...rest,...others]));
    inp.readOnly=true;
    $('[data-act="check"]',stage).innerHTML='Дальше <kbd>Enter</kbd>';$('[data-act="skip"]',stage).hidden=true;
    inp.focus({preventScroll:true});
    speak(word);
    if(learn)learnTyped(res);
  }

  function renderList(){
    if(!stage)return;
    stage.innerHTML=`<div class="wsearch"><input type="search" id="wl-filter" placeholder="Поиск по уроку ${S.lesson}" aria-label="Поиск по словам урока ${S.lesson}" autocomplete="off" spellcheck="false"><button type="button" class="btn ghost" data-act="reset">Сбросить прогресс урока</button></div>
      <p class="wl-sum"></p><div class="wl"><table><tbody></tbody></table></div>`;
    const inp=$('#wl-filter',stage);inp.value=S.filter;
    inp.addEventListener('input',()=>{S.filter=inp.value;fillList()});
    fillList();
  }
  function listSummary(found){
    const ws=WORDS[S.lesson]||[],st=wordStat(S.lesson);
    const s=$('.wl-sum',stage);if(!s)return;
    if(found!=null)s.dataset.found=found;
    const f=norm(S.filter)?+s.dataset.found:null;
    s.textContent=f!=null
      ?`Найдено ${f} из ${ws.length}. Выучено в уроке: ${st.done}.`
      :`${ws.length} ${plural(ws.length,['слово','слова','слов'])}, выучено ${st.done}, учатся ${st.learning}. Отметьте галочкой слово, которое уже знаете; снятая галочка возвращает его в новые.`;
  }
  function fillList(){
    const ws=WORDS[S.lesson]||[],f=norm(S.filter),fs=stripMarks(f);
    const rows=ws.filter(w=>!f||norm(w.cz).includes(f)||stripMarks(norm(w.cz)).includes(fs)||norm(w.ru).includes(f));
    listSummary(rows.length);
    $('tbody',stage).innerHTML=rows.length?rows.map(w=>{const i=ws.indexOf(w),on=learned(w.id);
      return `<tr data-id="${esc(w.id)}"><td class="k"><input type="checkbox" id="kw-${S.lesson}-${i}"${on?' checked':''} aria-label="Выучено: ${esc(split(w.cz).w)}"></td><td class="czw" lang="cs">${esc(w.cz)}</td><td class="ru">${esc(w.ru)}</td></tr>`}).join('')
      :`<tr class="none"><td class="empty" colspan="3">По запросу «${esc(S.filter)}» ничего нет. Проверьте написание или очистите поиск.</td></tr>`;
  }
  function setKnown(id,on){if(on)Mem.know(id);else Mem.reset([id]);listSummary();refreshProgress()}
  function resetLesson(btn){
    if(!btn.dataset.sure){btn.dataset.sure='1';btn.textContent='Точно сбросить?';btn.classList.remove('ghost');btn.classList.add('danger');return}
    Mem.reset((WORDS[S.lesson]||[]).map(w=>w.id));R=null;refreshProgress();
    announce(`Прогресс слов урока ${S.lesson} сброшен`);
    S.key='';enter();
  }
  function insertChar(c){const i=$('#wr-input',stage);if(i&&!i.readOnly)insertAt(i,c)}

  function onClick(e){
    if(e.target.matches('input'))return;
    const t=e.target.closest('[data-act],tr[data-id]');if(!t||!root.contains(t))return;
    if(t.matches('tr[data-id]')){const cb=$('input',t),on=!cb.checked;cb.checked=on;setKnown(t.dataset.id,on);return}
    switch(t.dataset.act){
      case 'mode':if(ui.mode!==t.dataset.mode){ui.mode=t.dataset.mode;saveUI();enter()}break;
      case 'dir':ui.dir=ui.dir==='cz'?'ru':'cz';saveUI();start();break;
      case 'flip':flip();break;
      case 'yes':swipeMark(true);break;
      case 'no':swipeMark(false);break;
      case 'say':{const w=curWord();if(w)speak(w.cz);break}
      case 'pick':quizPick(+t.dataset.i);break;
      case 'key':insertChar(t.dataset.c);break;
      case 'check':writeCheck(false);break;
      case 'skip':writeCheck(true);break;
      case 'again':start();break;
      case 'all':ui.onlyNew=false;saveUI();start();break;
      case 'reset':resetLesson(t);break;
      case 'lstart':if(ui.pace==='day')dayRound();else newRound();renderLearn(true);break;
      case 'pace':if(ui.pace!==t.dataset.pace){
        ui.pace=t.dataset.pace;saveUI();if(R&&R.done)R.shown=true;renderLearn(false);
        const b=$(`.pace [data-pace="${ui.pace}"]`,stage);if(b)b.focus({preventScroll:true});
      }break;
      case 'lsort':sortAnswer(+t.dataset.v);break;
      case 'lshow':sortShow();break;
      case 'lnext':{const task=curTask();if(!task)break;if(task.k==='intro')introNext();else if(R.ans)nextTask();break}
      case 'lknow':introKnown();break;
      case 'lpick':learnPick(+t.dataset.i);break;
      case 'lstop':if(R&&!R.done)finishRound();break;
    }
  }
  function onChange(e){
    const t=e.target;
    if(t.id==='only-new'){ui.onlyNew=t.checked;saveUI();if(ui.mode!=='list')start();return}
    if(t.closest('.wl')&&t.type==='checkbox'){const tr=t.closest('tr');if(tr)setKnown(tr.dataset.id,t.checked)}
  }
  function onKey(e){
    if(app.section!=='slova'||!stage||!stage.isConnected||e.altKey||e.ctrlKey||e.metaKey)return;
    const t=e.target;
    if((ui.mode==='write'||ui.mode==='learn')&&t.id==='wr-input'&&e.key==='Enter'){e.preventDefault();writeCheck(false);return}
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)return;
    if(ui.mode==='learn'){
      const task=curTask();if(!task)return;
      if(task.k==='sort'){
        if(e.key==='1'||e.key==='2'){e.preventDefault();sortAnswer(e.key==='2'?1:0)}
        else if(e.key===' '&&!(t.closest&&t.closest('button,a,summary,[role="button"]'))){e.preventDefault();sortShow()}
        return;
      }
      if(task.k==='pick'&&!R.ans&&/^[1-4]$/.test(e.key)){e.preventDefault();learnPick(+e.key-1);return}
      // Enter moves on when focus is not on a control that handles Enter itself
      if(e.key==='Enter'&&!(t.closest&&t.closest('button,a,summary,[role="button"]'))){
        if(task.k==='intro'){e.preventDefault();introNext()}
        else if(task.k==='pick'&&R.ans){e.preventDefault();nextTask()}
      }
      return;
    }
    if(!S.total||S.pos>=S.deck.length)return;
    if(ui.mode==='cards'){
      const onCard=t.classList&&t.classList.contains('flash');
      if(e.key===' '||e.key==='Enter'){if(!onCard&&t.closest&&t.closest('button,a,[role="button"]'))return;e.preventDefault();flip();return}
      if(!S.flipped)return;
      if(e.key==='1'||e.key==='ArrowLeft'){e.preventDefault();swipeMark(false)}
      else if(e.key==='2'||e.key==='ArrowRight'){e.preventDefault();swipeMark(true)}
    }else if(ui.mode==='quiz'&&/^[1-4]$/.test(e.key))quizPick(+e.key-1);
  }
  document.addEventListener('keydown',onKey);

  function confetti(){
    if(!motionOK())return;
    const cols=['var(--blue)','var(--red)','var(--good)','var(--warn)'];
    for(let i=0;i<40;i++){
      const d=el('i','confetti');d.setAttribute('aria-hidden','true');
      d.style.left=(Math.random()*96)+'vw';d.style.background=cols[i%4];
      d.style.animationDuration=(1.4+Math.random()*1.4)+'s';d.style.animationDelay=(Math.random()*.4)+'s';
      document.body.appendChild(d);setTimeout(()=>d.remove(),3400);
    }
  }
  return {render,refresh};
})();

// ---------- start ----------
buildNav();drawKbd();
window.addEventListener('hashchange',()=>route(true));
route(false);
})();
</script>
</body>
