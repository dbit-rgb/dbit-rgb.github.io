<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Čeština A1/A2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3CclipPath id='c'%3E%3Crect width='32' height='32' rx='7'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23c)'%3E%3Crect width='32' height='16' fill='%23fff'/%3E%3Crect y='16' width='32' height='16' fill='%23d7141a'/%3E%3Cpath d='M0 0 17 16 0 32z' fill='%2311457e'/%3E%3C/g%3E%3Crect x='.5' y='.5' width='31' height='31' rx='6.5' fill='none' stroke='%2318202d' stroke-opacity='.18'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: lesson rail on the left (a scrolling strip on phones). Each lesson is one column: header, the Грамматика / Слова switch, then either rules with exercises or the word trainer. The ground is a squared exercise book. */
:root{
  --paper:#f3f5f8; --grid:#e4e9f0; --surface:#ffffff; --sunk:#e9edf3; --ink:#18202d; --muted:#5a6476; --line:#d9dee7;
  --blue:#11457e; --blue-soft:#e3ebf6; --red:#b72f29; --red-soft:#fbe7e5;
  --good:#23794a; --good-soft:#e2f3e8; --warn:#8a5f00; --warn-soft:#fbf1d6; --shade:rgba(24,40,72,.3);
  --blue-2:#3d5f8a; /* secondary text on blue-soft surfaces */
  --good-mid:#8cc4a3; /* words still being learned, under the green of learned ones */
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cz:"PT Serif",Georgia,"Times New Roman",serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f141b; --grid:#151c26; --surface:#171e28; --sunk:#1f2834; --ink:#e6eaf1; --muted:#9aa4b4; --line:#2b3544;
  --blue:#8db4ea; --blue-soft:#1c2a3e; --red:#f0716a; --red-soft:#3a1f1f;
  --good:#63c98f; --good-soft:#173324; --warn:#e3b84f; --warn-soft:#352b12; --shade:rgba(0,0,0,.6); --blue-2:#a9c3e6; --good-mid:#2f6e4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f141b; --grid:#151c26; --surface:#171e28; --sunk:#1f2834; --ink:#e6eaf1; --muted:#9aa4b4; --line:#2b3544;
  --blue:#8db4ea; --blue-soft:#1c2a3e; --red:#f0716a; --red-soft:#3a1f1f;
  --good:#63c98f; --good-soft:#173324; --warn:#e3b84f; --warn-soft:#352b12; --shade:rgba(0,0,0,.6); --blue-2:#a9c3e6; --good-mid:#2f6e4b; color-scheme:dark}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px;scrollbar-gutter:stable}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font:16px/1.6 var(--f-body);scrollbar-color:var(--line) transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:var(--blue);text-underline-offset:3px}
::selection{background:var(--blue);color:var(--surface)}
input{caret-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
kbd{display:none;font:600 11px/1 var(--f-body);color:inherit;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:2px 4px}
@media (hover:hover) and (pointer:fine){kbd{display:inline-block}}
.ic{width:1.1em;height:1.1em;flex:none}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:fixed;left:12px;top:-64px;z-index:30;background:var(--blue);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 28px;display:flex;flex-direction:column;gap:12px}
.brand{font:700 16px/1.2 var(--f-display);margin:0;padding:0 8px}
.brand span{color:var(--red)}
.brand-sub{margin:-6px 0 6px;padding:0 8px;font-size:13px;color:var(--muted)}
.legend{display:grid;grid-template-columns:30px 1fr 1fr;column-gap:8px;padding:0 8px;font-size:12px;line-height:1.2;color:var(--muted)}
.legend span:first-child{grid-column:2}
.legend-m{display:none}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:8px;row-gap:7px;align-items:center;padding:9px 8px;border-radius:8px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--blue-soft)}
.nav .num{font:700 13px/1 var(--f-display);color:var(--blue);text-align:center;font-variant-numeric:tabular-nums}
.nav .t{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;font-weight:600;font-size:14.5px;line-height:1.25}
.nav .bars{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{position:relative;display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.nav a[aria-current="page"] .bar{background:var(--surface)}
.bar i{position:relative;display:block;height:100%;width:0;background:var(--good);border-radius:inherit;transition:width .5s cubic-bezier(.2,.9,.3,1)}
.bar i.mid{position:absolute;inset:0 auto 0 0;background:var(--good-mid)}
/* words due for review today: in the rail and on the «Учить» mode */
.due{display:inline-block;flex:none;min-width:20px;height:18px;padding:0 6px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font:600 11.5px/18px var(--f-body);text-align:center;font-variant-numeric:tabular-nums}
.nav a[aria-current="page"] .due{background:var(--surface)}
main{min-width:0;padding-block:30px 120px;padding-inline:clamp(16px,4vw,48px);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
main:focus{outline:none}
.col{max-width:780px;margin:0 auto}

/* ---------- lesson header + section switch ---------- */
.lhead{display:flex;gap:8px 20px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.lnum{font:700 64px/.86 var(--f-display);color:var(--blue);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ltitle{flex:1;min-width:200px}
.ltitle h1{font:700 26px/1.15 var(--f-display);margin:0;text-wrap:balance}
.ltitle h1:focus{outline:none}
.ltitle p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sections a{display:flex;flex-direction:column;gap:3px;min-width:0;padding:12px 16px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);text-decoration:none}
.sections a b{font:700 16px/1.25 var(--f-display);color:var(--ink)}
.sections .sm{font-size:13.5px;font-variant-numeric:tabular-nums}
.sections .bar{margin-top:7px}
.sections a:hover{border-color:var(--blue)}
.sections a[aria-current="page"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.sections a[aria-current="page"] b{color:var(--blue)}
.sections a[aria-current="page"] .sm{color:var(--ink)}
.sections a[aria-current="page"] .bar{background:var(--surface)}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;border:1px solid var(--blue);border-radius:8px;background:var(--blue);color:var(--surface);font:600 14px/1.2 var(--f-body);text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{filter:none;border-color:var(--blue)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13px}
.btn.lg{min-height:48px;padding:11px 18px;font-size:15px;border-radius:10px}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad,.btn.danger{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn.good:hover,.btn.bad:hover{filter:none;box-shadow:inset 0 0 0 1px currentColor}
.btn:disabled{opacity:.5;filter:none}
.btn:active:not(:disabled){transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.row.center{justify-content:center}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.key{min-width:36px;height:36px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:16px var(--f-cz);touch-action:manipulation}
.key:hover{border-color:var(--blue)}
.key.shift{display:inline-grid;place-items:center;min-width:46px}
.key.shift .ic{width:18px;height:18px}
.key.shift .bar{visibility:hidden}
.key.shift[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.key.shift.lock .arrow{fill:currentColor}
.key.shift.lock .bar{visibility:visible}

/* ---------- grammar ---------- */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 4px}
.toc a{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-size:13.5px;line-height:1.3;text-decoration:none}
.toc a:hover{border-color:var(--blue)}
.toc a .ic{display:none;width:15px;height:15px}
.toc a.done{border-color:var(--good);color:var(--good)}
.toc a.done .ic{display:block}
.toc a .wk{width:7px;height:7px;border-radius:50%;background:var(--red)}
.mixbtn{display:inline-flex;align-items:center;min-height:32px;padding:5px 14px;border:0;border-radius:99px;background:var(--blue);color:var(--surface);font-size:13.5px;font-weight:600}
.mixbtn:hover{filter:brightness(1.1)}
.rule{margin-top:44px;scroll-margin-top:16px}
.rhead{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.roman{min-width:30px;font:700 14px var(--f-display);color:var(--red)}
.rhead h2{flex:1;min-width:0;margin:0;font:700 20px/1.25 var(--f-display);text-wrap:balance}
.rhead h2:focus{outline:none}
.rhead .ru{width:100%;padding-left:42px;color:var(--muted);font-size:14.5px}
.explain{margin-top:12px;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.explain p{margin:0 0 10px;max-width:68ch}
.explain p:last-child{margin-bottom:0}
.explain ul{margin:0 0 10px;padding-left:20px}
.explain li{margin:3px 0}
.gpanel i,.gpanel .cz{font-family:var(--f-cz);font-style:normal;color:var(--blue);font-size:1.03em}
.gpanel i b,.gpanel .cz b{color:var(--red)}
.tw{overflow-x:auto;margin:10px 0 12px}
.tw table{min-width:100%;border-collapse:collapse;font-size:14.5px}
.tw th{padding:6px 10px;border-bottom:1px solid var(--line);color:var(--muted);font:600 12.5px var(--f-body);text-align:left;white-space:nowrap}
.tw td{padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--f-cz);vertical-align:top}
.tw td.ru{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.tw td b{color:var(--red)}
.tw tr:last-child td{border-bottom:0}
.pz{margin:10px 0;padding:10px 14px;border-radius:8px;background:var(--red-soft);font-size:14.5px}
.pz::before{content:"Pozor!";display:block;margin-bottom:3px;font:700 12px var(--f-display);letter-spacing:.04em;color:var(--red)}
.tip{margin:10px 0;padding:10px 14px;border-radius:8px;background:var(--blue-soft);font-size:14.5px}
.exwrap{margin-top:16px}
.exhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.exhead h3{margin:0;font:600 14px var(--f-body);color:var(--muted)}
.exmeta{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.item.ok{border-color:var(--good)}
.item.bad{border-color:var(--red)}
.item.bad.near{border-color:var(--warn)}
.item .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);color:var(--muted);font:600 12px var(--f-body);font-variant-numeric:tabular-nums}
.item.ok .n{background:var(--good-soft);color:var(--good)}
.item.bad .n{background:var(--red-soft);color:var(--red)}
.item.bad.near .n{background:var(--warn-soft);color:var(--warn)}
.kind{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px;font-size:12.5px;color:var(--muted)}
.solved{display:none;align-items:center;gap:4px;color:var(--good);font-weight:600}
.item.is-done .solved{display:inline-flex}
.kind .was{color:var(--red);font-weight:600}
.item.is-done .was{display:none}
.q{font-family:var(--f-cz);font-size:17px;line-height:1.55}
.q.ru{font-family:var(--f-body);font-size:16px}
.opt.ru{font-family:var(--f-body);font-size:15px}
.q .gap{display:inline-block;min-width:3.4em;border-bottom:2px solid var(--blue);color:var(--blue);text-align:center;line-height:1.2}
.q .filled{padding:0 .12em;border-bottom:2px solid var(--good);color:var(--good);font-weight:700}
.solved-note{margin-top:6px;font-size:14px;color:var(--muted)}
.opt{min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:16px var(--f-cz)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);text-decoration:line-through}
input.ans{width:min(260px,100%);min-height:40px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:17px var(--f-cz)}
input.ans:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.fb{margin-top:8px;font-size:14.5px}
.fb:empty{display:none}
.fb:focus{outline:none}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--red)}
.fb.warn{color:var(--warn)}
.fb i{color:inherit;font-weight:700}
.fb .ex{color:var(--muted)}
.fb .ic{margin-right:5px;vertical-align:-.2em}
.fb .btn{margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;margin-top:10px;padding:6px;border:1px dashed var(--line);border-radius:8px}
.chips.pool{border-style:solid;background:var(--paper)}
.chip{min-height:32px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:15.5px var(--f-cz)}
.chip:hover{border-color:var(--blue)}
.chips .placeholder{padding:4px;color:var(--muted);font-size:13.5px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px}
.match .colm{display:flex;flex-direction:column;gap:6px;min-width:0}
.mbtn{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:15.5px var(--f-cz);text-align:left;overflow-wrap:anywhere}
.mbtn:hover{border-color:var(--blue)}
.mbtn.sel{border-color:var(--blue);background:var(--blue-soft)}
.mbtn.done{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.mbtn.no{border-color:var(--red);background:var(--red-soft)}
.mix{margin-top:18px;padding:16px;border-radius:12px;background:var(--blue-soft)}
.mix h2{margin:0 0 4px;font:700 17px var(--f-display)}
.mix h2:focus{outline:none}
.mix p{margin:0 0 12px;color:var(--blue-2);font-size:14.5px}
/* «Разбор по шагам»: a guided walk through a harder rule, on the blue wash like the mixed training */
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--blue-soft)}
.gbar p{flex:1 1 300px;margin:0;font-size:14.5px;color:var(--blue-2)}
.gbar b{color:var(--ink);font-weight:600}
.gbar.done b{color:var(--good)}
.gbar b .ic{margin-right:5px;vertical-align:-.2em}
/* «Новые задания»: fresh exercises from the rule's generator, outside the rule's progress */
.gnewp{margin-top:12px;padding:14px 16px 16px;border-radius:12px;background:var(--blue-soft)}
.gnewp .exhead h3{font:700 15px/1.3 var(--f-display);color:var(--ink)}
.gnewp .exhead h3:focus{outline:none}
.gnewp .exmeta{color:var(--blue-2)}
.gnewp .row{margin-top:12px}
.guide{margin-top:12px;padding:18px 20px 20px;border-radius:12px;background:var(--blue-soft)}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px}
.ghead h3{margin:0;font:700 17px/1.3 var(--f-display);text-wrap:balance}
.ghead h3:focus{outline:none}
.gprog{display:flex;gap:4px;margin:8px 0 4px}
.gprog button{flex:1;min-width:0;height:24px;padding:9px 0;border:0;background:none}
.gprog i{display:block;height:6px;border-radius:3px;background:var(--surface)}
.gprog .done i{background:var(--good)}
.gprog .cur i{background:var(--blue)}
.gprog button:hover i{box-shadow:inset 0 0 0 1px var(--blue)}
.gbody p{margin:10px 0;max-width:68ch}
.gbody .tip{background:var(--surface)}
.gbody .tw th,.gbody .tw td.ru{color:var(--blue-2)}
.gex{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 20px;margin:10px 0;padding:0;list-style:none}
.gex li span{font-size:13.5px;color:var(--blue-2)}
.guide .item{margin-top:14px;grid-template-columns:minmax(0,1fr)}
.guide .item .n{display:none}
.gnav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:16px}
.fb .glink{margin-left:8px}
.kbd{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:calc(100% - 24px);padding:6px;border-radius:12px;background:var(--sunk);box-shadow:0 10px 24px -8px var(--shade);transform:translateX(-50%)}

/* ---------- words ---------- */
.wtool{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin:24px 0 12px}
.modes{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mode{min-height:36px;padding:7px 13px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:600 14px var(--f-body)}
.mode:hover{background:var(--sunk);color:var(--ink)}
.mode[aria-pressed="true"]{background:var(--blue);color:var(--surface)}
.mode .due{margin-left:7px}
.mode[aria-pressed="true"] .due{background:var(--surface);color:var(--blue)}
.wset{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;color:var(--muted)}
.check{display:inline-flex;align-items:center;gap:8px;min-height:36px;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--blue);cursor:pointer}
.stage{display:flex;flex-direction:column;gap:18px;min-width:0;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.wmeta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wprog{height:6px;margin-top:-10px;border-radius:3px;background:var(--sunk);overflow:hidden}
.wprog i{display:block;height:100%;background:var(--blue);transition:width .25s}
.flash{border-radius:12px;perspective:1100px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline-offset:4px}
.flash .inner{display:grid;min-height:220px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash.drag .inner{transition:none}
.face{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;padding:24px 16px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);border-style:solid;border-color:var(--blue);background:var(--blue-soft)}
.face.back .qline,.face.back .whint,.face.back .wgram{color:var(--blue-2)}
.touch-only{display:none}
@media (hover:none),(pointer:coarse){.touch-only{display:block}}
.tint{grid-area:1/1;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .15s}
.qcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;padding:22px 56px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}
.qcard .speak{position:absolute;top:8px;right:8px;width:44px;height:44px}
.kb-only{display:none}
@media (hover:hover) and (pointer:fine){.kb-only{display:inline}}
.word{max-width:100%;font:700 clamp(25px,5.5vw,34px)/1.25 var(--f-cz);color:var(--blue);overflow-wrap:anywhere;text-wrap:balance}
.word.ru{font:500 clamp(21px,5vw,28px)/1.3 var(--f-body);color:var(--ink)}
.wgram{font-size:13.5px;color:var(--muted)}
.qline{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.qline.cz{font-family:var(--f-cz)}
.answer{max-width:100%;font:600 clamp(19px,4.6vw,23px)/1.35 var(--f-body);color:var(--ink);overflow-wrap:anywhere;text-wrap:balance}
.answer.cz{font:700 clamp(23px,5.2vw,30px)/1.25 var(--f-cz);color:var(--blue)}
.whint{font-size:13px;color:var(--muted)}
.wbtns{display:flex;flex-wrap:wrap;gap:10px;margin:0}
.wbtns .btn{flex:1 1 150px}
.speak{display:inline-grid;place-items:center;flex:none;width:48px;height:48px;border:0;border-radius:50%;background:var(--blue-soft);color:var(--blue)}
.speak .ic{width:20px;height:20px}
.speak:hover{box-shadow:inset 0 0 0 1px var(--blue)}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wopt{display:flex;align-items:center;gap:10px;min-height:52px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15.5px/1.35 var(--f-body);text-align:left;overflow-wrap:anywhere}
.wopt span{flex:1;min-width:0}
.wopt.cz{font:700 17px/1.3 var(--f-cz);color:var(--blue)}
.wopt kbd{color:var(--muted)}
.wopt:hover:not(:disabled){border-color:var(--blue)}
.wopt:disabled{cursor:default}
.wopt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.wopt.no{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.wr-input{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:500 19px var(--f-cz)}
.wr-input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.wr-input::placeholder,.wsearch input::placeholder{color:var(--muted);opacity:1}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys .key{min-width:40px;height:40px}
.wfb:empty{display:none}
.verdict{display:flex;align-items:flex-start;gap:8px;padding:11px 14px;border-radius:10px;font-weight:500}
.verdict .ic{margin-top:.22em}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--red-soft);color:var(--red)}
.verdict b{font-family:var(--f-cz);font-size:1.08em;color:var(--ink)}
.verdict .wgram{margin-left:6px}
.walt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:8px;padding:10px 14px;border-radius:10px;background:var(--blue-soft)}
.walt-l{flex:0 0 100%;font-size:13px;color:var(--blue-2)}
.walt b{font:700 17px/1.35 var(--f-cz);color:var(--blue);overflow-wrap:anywhere}
/* «Учить»: the lesson's words as squares of the exercise book, filled in as they are learned */
.lhome{display:flex;flex-direction:column;gap:16px}
.wmap{--cell:14px;display:grid;grid-template-columns:repeat(auto-fill,var(--cell));gap:4px;justify-content:start}
.wleg{--cell:12px;display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}
.wmap i,.wleg i{display:block;flex:none;width:var(--cell);height:var(--cell);border:1px solid var(--line);border-radius:3px;background:var(--paper)}
.wmap i.l,.wleg i.l{border-color:var(--good);background:var(--good-soft)}
.wmap i.k,.wleg i.k{border-color:var(--good);background:var(--good)}
.wmap i.d,.wleg i.d{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.wleg li{display:inline-flex;align-items:center;gap:7px}
.wleg b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lnote{margin:0;max-width:62ch}
.lnote+.lnote{margin-top:-10px}
.how{font-size:14px;color:var(--muted)}
.how summary{display:inline-flex;align-items:center;gap:6px;min-height:32px;color:var(--ink);font-weight:600;cursor:pointer;list-style:none}
.how summary::-webkit-details-marker{display:none}
.how[open] summary .ic{transform:rotate(90deg)}
.how ul{margin:4px 0 0;padding-left:20px}
.how li{margin:4px 0;max-width:66ch}
.icard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;padding:24px 56px;border:1.5px solid var(--blue);border-radius:12px;background:var(--blue-soft);text-align:center}
.icard .speak{position:absolute;top:8px;right:8px;width:44px;height:44px;background:var(--surface)}
.icard .wgram,.icard .whint{color:var(--blue-2)}
/* the pace inside «Учить»: «По порциям» or «Урок за день» */
.pace{display:inline-flex;align-self:flex-start;gap:2px;padding:3px;border:1px solid var(--line);border-radius:99px;background:var(--paper)}
.pace button{min-height:32px;padding:5px 14px;border:0;border-radius:99px;background:transparent;color:var(--muted);font:600 13.5px var(--f-body)}
.pace button:hover{color:var(--ink)}
.pace button[aria-pressed="true"]{background:var(--surface);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
/* «Урок за день»: the four steps of the day, in order */
.steps{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:9px 12px;border-radius:10px}
.steps li.cur{background:var(--blue-soft)}
.steps .sn{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);color:var(--muted);font:600 12px var(--f-body);font-variant-numeric:tabular-nums}
.steps .sn .ic{width:14px;height:14px}
.steps .cur .sn{background:var(--blue);color:var(--surface)}
.steps .done .sn{background:var(--good-soft);color:var(--good)}
.steps .sx b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.steps .sx span{display:block;font-size:13.5px;line-height:1.35;color:var(--muted)}
.steps .cur .sx span,.steps .cur .ss{color:var(--blue-2)}
.steps .ss{font-size:13.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.steps .done .ss{color:var(--good)}
.sortcz{display:flex;flex-direction:column;align-items:center;gap:4px}
.result{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0;text-align:center}
.result p{margin:0}
.result .rlabel{font-weight:600;color:var(--muted)}
.result .big{font:700 52px/1 var(--f-display);color:var(--blue);font-variant-numeric:tabular-nums}
.result .big .ic{width:56px;height:56px;color:var(--good)}
.wsearch{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wsearch input{flex:1 1 220px;min-width:0;min-height:46px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:16px var(--f-body)}
.wsearch input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.wl-sum{margin:0;font-size:13.5px;color:var(--muted)}
.wl{overflow-x:auto}
.wl table{width:100%;border-collapse:collapse;font-size:15px}
.wl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.wl tr:last-child td{border-bottom:0}
.wl tbody tr{cursor:pointer}
.wl tbody tr:hover td{background:var(--sunk)}
.wl td.k{width:40px;text-align:center}
.wl td.k input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--good);cursor:pointer}
.wl td.czw{width:48%;font-family:var(--f-cz);font-weight:700;color:var(--blue)}
.wl td.empty{padding:24px 8px;color:var(--muted);text-align:center;cursor:default}
.wl tr.none:hover td{background:none}
.foot{max-width:72ch;margin-top:56px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot p{margin:0 0 6px}

/* ---------- motion ---------- */
@media (prefers-reduced-motion:no-preference){
  .item{transition:border-color .2s}
  .pop-in{animation:popIn .38s cubic-bezier(.2,1.2,.5,1) both}
  .verdict{animation:popIn .3s ease both}
  .wopt.ok{animation:pulse .5s ease}
  .wopt.no,.shake{animation:shake .4s ease}
  .flash.out-r{animation:outR .32s ease-in forwards}
  .flash.out-l{animation:outL .32s ease-in forwards}
  .result .big{animation:popIn .6s cubic-bezier(.2,1.6,.4,1) both}
  .wmap i.up{animation:cellIn .5s cubic-bezier(.2,1.5,.4,1) both}
  .how summary .ic{transition:transform .2s}
}
@keyframes cellIn{from{transform:scale(.3)}}
@keyframes popIn{from{transform:translateY(10px) scale(.97)}}
@keyframes pulse{40%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes outR{to{transform:translateX(120%) rotate(14deg);opacity:0}}
@keyframes outL{to{transform:translateX(-120%) rotate(-14deg);opacity:0}}
.confetti{position:fixed;top:-12px;z-index:40;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- phones ---------- */
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;overflow:visible;padding:12px 16px 8px;gap:6px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0}
  .brand-sub,.legend{display:none}
  .legend-m{display:block;margin:0;font-size:12px;color:var(--muted)}
  .nav{flex-direction:row;gap:6px;margin-inline:-16px;padding:2px 16px 6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin}
  .nav a{flex:0 0 auto;width:150px;grid-template-columns:auto minmax(0,1fr);align-content:space-between;border:1px solid var(--line);scroll-snap-align:start;scroll-margin-inline:16px}
  .nav .num{text-align:left}
  .nav .bars{grid-column:1/-1}
  main{padding-block:18px 120px}
  .lhead{margin-bottom:16px}
  .lnum{font-size:44px}
  .ltitle h1{font-size:22px}
  .rhead .ru{padding-left:0}
  .wtool{margin:16px 0 10px}
  .toc{margin-top:18px}
}
@media (max-width:520px){
  .sections{gap:8px}
  .sections a{padding:9px 12px 11px}
  .stage{padding:16px;gap:16px}
  .flash .inner{min-height:190px}
  .qcard{min-height:130px}
  .icard{min-height:170px;padding:22px 52px}
  .wmap{--cell:12px;gap:3px}
  .steps li{grid-template-columns:26px minmax(0,1fr);padding:9px 10px}
  .steps .ss{grid-column:2;text-align:left}
  .wopts{grid-template-columns:1fr}
  .explain{padding:16px}
  .guide{padding:16px}
  .gbar{padding:12px 14px}
  .item{padding:12px;gap:8px}
  .match{gap:6px 8px}
}
</style>
</head>
<body>
<a class="skip" href="#main">Перейти к уроку</a>
<div class="shell">
  <aside class="rail">
    <p class="brand">Čeština <span>A1/A2</span></p>
    <p class="brand-sub">Грамматика и слова по 12 урокам</p>
    <div class="legend" aria-hidden="true"><span>грамматика</span><span>слова</span></div>
    <p class="legend-m" aria-hidden="true">Левая полоска — грамматика, правая — слова</p>
    <nav class="nav" id="nav" aria-label="Уроки"></nav>
  </aside>
  <main id="main" tabindex="-1">
    <div class="col" id="view"><noscript><p>Для упражнений и тренажёра слов нужен JavaScript. Включите его в браузере и обновите страницу.</p></noscript></div>
  </main>
</div>
<div class="kbd" id="kbd" role="toolbar" aria-label="Буквы с диакритикой" hidden></div>
<div class="sr" id="live" aria-live="polite"></div>
<script>
// Grammar: rules and exercises for lessons 1-12
// ---------- helpers for authoring ----------
const T=(h,...rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>c.startsWith('~')?`<td class="ru">${c.slice(1)}</td>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const C=(q,o,e)=>({t:'c',q,o:o.split('|').map(x=>x.replace(/^\*/,'')),a:o.split('|').findIndex(x=>x.startsWith('*')),e});
const I=(q,a,e)=>({t:'i',q,a:a.split('|'),e});
const O=(a,e)=>({t:'o',a,e});
const M=(p)=>({t:'m',p:p.split(';').map(x=>x.split('=').map(s=>s.trim()))});

const GRAM=[];

// ================= LEKCE 1 =================
GRAM.push({n:1,cz:'Pozdravy',ru:'Приветствия, знакомство, обращение',rules:[
{cz:'Osobní zájmena',ru:'Личные местоимения',html:`
<p>Шесть лиц, как в русском. Местоимение-подлежащее в чешском обычно <b>опускают</b>: окончание глагола и так показывает лицо (<i>Jsem Dana.</i> вместо <i>Já jsem Dana.</i>). Местоимение ставят, когда хотят подчеркнуть или противопоставить.</p>
${T(['','singulár','','plurál',''],['1','já','~я','my','~мы'],['2','ty','~ты','vy','~вы'],['3','on / ona / ono','~он / она / оно','oni','~они'])}
<div class="tip">Вместо <i>ono</i> в живой речи обычно говорят <i>to</i>: <i>To je dítě.</i></div>`,
ex:[M('já=я;ty=ты;on=он;ona=она;my=мы;vy=вы;oni=они'),
C('Как сказать «мы»?','já|*my|vy|oni'),
C('«oni» — это…','*они|он|она|вы'),
C('<i>Jsem</i> Dana. — Какое местоимение подразумевается?','*já|ty|ona|my'),
C('Какие местоимения — plurál (мн. ч.)? Выберите лишнее (singulár):','my|vy|oni|*ty')]},

{cz:'Sloveso BÝT',ru:'Глагол «быть», отрицание, «ты» и «Вы»',html:`
<p>В отличие от русского, связка <i>být</i> в настоящем времени <b>не пропускается</b>: «Я студент» = <i>Jsem student.</i></p>
${T(['','být','ne-','','být','ne-'],['já','jsem','nejsem','my','jsme','nejsme'],['ty','jsi','nejsi','vy','jste','nejste'],['on/ona/ono','je','<b>není</b>','oni','jsou','nejsou'])}
<div class="pz">Отрицание от <i>je</i> — не «neje», а <i>není</i>. Частица <i>ne-</i> пишется слитно с глаголом.</div>
<p><b>Vykání a tykání.</b> К незнакомым и старшим обращаются на «Вы» (<i>vy jste</i>) даже к одному человеку, к друзьям — на «ты» (<i>ty jsi</i>).</p>
${T(['vy (formálně)','ty (neformálně)'],['Dobrý den.','Ahoj. / Čau.'],['Jak se jmenujete?','Jak se jmenuješ?'],['Jak se máte?','Jak se máš?'],['Promiňte.','Promiň.'],['Na shledanou.','Ahoj. / Čau.'])}`,
ex:[I('Já ___ student. (být)','jsem'),I('Petr ___ Čech. (být)','je'),I('My ___ doma. (být)','jsme'),I('Oni ___ studenti. (být)','jsou'),I('Ty ___ Alena? (být)','jsi'),
I('Petr ___ Čech. (negace)','není','Отрицание от je — není.'),I('Já ___ manažer. (negace)','nejsem'),I('Vy ___ Jan a Adam? (negace)','nejste'),
C('Dobrý den, pane Nový, ___ jste doktor?','ty|*vy'),C('Ahoj Karle, ___ jsi student?','*ty|vy'),
M('Ahoj.=Dobrý den.;Jak se máš?=Jak se máte?;Promiň.=Promiňte.;Jak se jmenuješ?=Jak se jmenujete?'),
O('Dobrý den, jste Alena Králová?')]},

{cz:'Vokativ',ru:'Звательный падеж (обращение)',html:`
<p>Когда мы <b>обращаемся</b> к человеку, имя меняет форму: <i>To je Jana.</i> → <i>Ahoj Jan<b>o</b>!</i> Это 5-й падеж — vokativ.</p>
${T(['основная форма','vokativ','правило'],['Adam, pán, pan Pospíšil','Adam<b>e</b>, pan<b>e</b>, pane Pospíšil<b>e</b>','~твёрдая/нейтральная согласная → -e'],['Aleš, Matěj','Aleš<b>i</b>, Matěj<b>i</b>','~мягкая согласная → -i'],['Marek, Oleg, pan Vlach','Mark<b>u</b>, Oleg<b>u</b>, pane Vlach<b>u</b>','~-k, -g, -ch → -u'],['Madla, slečna, Honza','Madl<b>o</b>, slečn<b>o</b>, Honz<b>o</b>','~-a → -o (и у мужских на -a)'],['Marie, Alice','Marie, Alice','~-e не меняется'],['Dagmar, Ingrid','Dagmar, Ingrid','~женские на согласную не меняются'],['paní Nováková, pan Nový','paní Nováková, pane Nový','~-á/-í/-ý (прилагательные) не меняются'])}
<div class="pz"><i>pan</i> (господин + фамилия) и <i>pán</i> (мужчина) → в обращении оба <i>pane</i>. Слова на <i>-tel</i>: <i>pane učiteli</i>. Иностранные имена часто: <i>Ahoj Charlesi</i>, но <i>Čau Betty</i>.</div>`,
ex:[I('Ahoj ___! (Jana)','Jano'),I('Dobrý den, ___! (Šimon)','Šimone'),I('Čau ___! (Aleš)','Aleši'),I('Jak se máš, ___? (Marek)','Marku'),I('Ahoj ___! (Honza)','Honzo'),I('Dobrý den, ___! (pan Nový)','pane Nový'),I('Dobrý večer, ___! (paní Nováková)','paní Nováková'),I('Čau ___! (Lucie)','Lucie'),I('Děkuju, ___! (pan učitel)','pane učiteli'),I('Ahoj ___! (Madla)','Madlo'),I('Ahoj ___! (Matěj)','Matěji'),I('Dobré ráno, ___! (pan Vlach)','pane Vlachu'),
C('Обращение к Адаму:','Adam|*Adame|Adamu|Adamo')]},

{cz:'Kdo je to? Co je to?',ru:'Кто это? Что это?',html:`
<p><i>Kdo</i> — о людях (и животных), <i>Co</i> — о предметах, местах, понятиях. Ответ: <i>To je…</i></p>
${T(['Kdo je to?','Co je to?'],['To je učitel.','To je mapa.'],['To je pan Novák.','To je formulář.'],['To je studentka.','To je město.'])}`,
ex:[C('___ je to? — To je student.','*Kdo|Co'),C('___ je to? — To je mapa.','Kdo|*Co'),C('___ je to? — To je pan Novák.','*Kdo|Co'),C('___ je to? — To je formulář.','Kdo|*Co'),C('___ je to? — To je slečna.','*Kdo|Co'),C('___ je to? — To je ulice.','Kdo|*Co'),C('___ je to? — To je Matěj.','*Kdo|Co'),C('___ je to? — To je adresa.','Kdo|*Co'),O('Kdo je to? To je učitelka.')]}
]});

// ================= LEKCE 2 =================
GRAM.push({n:2,cz:'Seznamování, představování',ru:'Знакомство, представление',rules:[
{cz:'Rody substantiv',ru:'Род существительных',html:`
<p>Как и в русском, три рода. Род почти всегда видно по окончанию в именительном падеже:</p>
${T(['maskulinum (M)','femininum (F)','neutrum (Neu)'],['<b>согласная</b>: student, muž, sešit, počítač','<b>-a, -e/-ě</b>: žena, mapa, ulice, země','<b>-o, -í</b>: město, jméno, náměstí, příjmení'])}
<div class="pz">Исключения в женский род: некоторые слова на мягкую согласную (<i>skříň, noc</i>), все слова на суффикс <i>-ost</i> (<i>národnost, místnost</i>) и <i>paní</i>.</div>`,
ex:[C('sešit','*M|F|Neu'),C('tabule','M|*F|Neu'),C('náměstí','M|F|*Neu'),C('okno','M|F|*Neu'),C('ulice','M|*F|Neu'),C('počítač','*M|F|Neu'),C('národnost','M|*F|Neu','Суффикс -ost → женский род.'),C('skříň','M|*F|Neu'),C('jméno','M|F|*Neu'),C('paní','M|*F|Neu'),C('stůl','*M|F|Neu'),C('příjmení','M|F|*Neu')]},

{cz:'Ten, ta, to · jeden, jedna, jedno',ru:'Указательное «этот» и числительное «один»',html:`
<p>Указательное местоимение и числительное <i>jeden</i> согласуются с родом существительного:</p>
${T(['M','F','Neu'],['<b>ten</b> / <b>jeden</b> muž','<b>ta</b> / <b>jedna</b> žena','<b>to</b> / <b>jedno</b> město'],['ten sešit','ta mapa','to jméno'])}`,
ex:[I('___ sešit (ten/ta/to)','ten'),I('___ ulice (ten/ta/to)','ta'),I('___ jméno (ten/ta/to)','to'),I('___ národnost (ten/ta/to)','ta'),I('___ náměstí (ten/ta/to)','to'),I('___ profesor (ten/ta/to)','ten'),
C('___ žena je doktorka.','Jeden|*Jedna|Jedno'),C('___ město je Praha.','Jeden|Jedna|*Jedno'),C('___ muž je doktor.','*Ten|Ta|To')]},

{cz:'Adjektiva',ru:'Прилагательные: -ý/-á/-é и -í',html:`
<p>Два типа прилагательных. <b>Твёрдые</b> меняют окончание по роду, <b>мягкие</b> на <i>-í</i> — одинаковы во всех родах.</p>
${T(['','M','F','Neu'],['твёрдые','nov<b>ý</b> student','nov<b>á</b> mapa','nov<b>é</b> okno'],['мягкие','modern<b>í</b> počítač','modern<b>í</b> židle','modern<b>í</b> město'])}
<p>Примеры мягких: <i>moderní, inteligentní, starší, telefonní, křestní, státní</i>.</p>`,
ex:[I('To je ___ město. (velký)','velké'),I('To je ___ mapa. (malý)','malá'),I('To je ___ student. (nový)','nový'),I('To je ___ židle. (moderní)','moderní'),I('Ta paní je moc ___. (milý)','milá'),I('Ten mobil je ___. (starý)','starý'),I('To příjmení je ___? (český)','české'),I('Jaké je to ___ číslo? (telefonní)','telefonní'),I('Daniela je ___. (inteligentní)','inteligentní'),
C('Какое прилагательное одинаково во всех родах?','nový|*starší|malý|hezký')]},

{cz:'Jaký, jaká, jaké?',ru:'Вопрос «какой?»',html:`
<p>Вопросительное слово согласуется с существительным так же, как прилагательное:</p>
${T(['M','F','Neu'],['<b>Jaký</b> je ten stůl?','<b>Jaká</b> je ta mapa?','<b>Jaké</b> je to okno?'],['Ten stůl je starý.','Ta mapa je velká.','To okno je malé.'])}`,
ex:[C('___ je ta mapa?','Jaký|*Jaká|Jaké'),C('___ je ten počítač?','*Jaký|Jaká|Jaké'),C('___ je to město?','Jaký|Jaká|*Jaké'),C('___ je ta židle?','Jaký|*Jaká|Jaké'),C('___ je to okno?','Jaký|Jaká|*Jaké'),C('___ je ten student?','*Jaký|Jaká|Jaké')]},

{cz:'Slovesa -OVAT',ru:'Глаголы на -ovat',html:`
<p>Очень частый тип: <i>pracovat, studovat, cestovat, tancovat, nakupovat, děkovat, jmenovat se…</i> Суффикс <i>-ova-</i> заменяется на <i>-u-</i>:</p>
${T(['','pracovat','','pracovat'],['já','prac<b>uju</b>','my','prac<b>ujeme</b>'],['ty','prac<b>uješ</b>','vy','prac<b>ujete</b>'],['on/ona','prac<b>uje</b>','oni','prac<b>ujou</b>'])}
<div class="tip">Для «já» и «oni» есть две формы: разговорная <i>pracuju / pracujou</i> и книжная <i>pracuji / pracují</i>. Обе правильные.</div>`,
ex:[I('já ___ (studovat)','studuju|studuji'),I('ty ___ (cestovat)','cestuješ'),I('ona ___ (lyžovat)','lyžuje'),I('my ___ (nakupovat)','nakupujeme'),I('vy ___ (tancovat)','tancujete'),I('oni ___ (sportovat)','sportujou|sportují'),I('on ___ (telefonovat) — negace','netelefonuje'),I('my ___ (pracovat) — negace','nepracujeme'),I('Já ___ Dáša. (jmenovat se)','se jmenuju|se jmenuji'),
C('Alena a Libor ___.','lyžuje|*lyžujou|lyžujete')]},

{cz:'Rád / ráda / rádi + sloveso',ru:'«Люблю делать»: rád + глагол',html:`
<p>«Я люблю путешествовать» = <i>Rád cestuju</i> (букв. «охотно путешествую»). Форма <i>rád</i> согласуется с подлежащим по роду и числу:</p>
${T(['','','',''],['on, já (муж.)','rád','ona, já (жен.)','ráda'],['my, vy, oni','rádi','vy (вежливо, к одному)','rád / ráda'])}
<p>Отрицание: <i>nerad, nerada, neradi</i> — обратите внимание, <b>без долготы</b>: <i>rád → nerad</i>.</p>`,
ex:[C('Karel ___ cestuje.','*rád|ráda|rádi'),C('Alena ___ tancuje.','rád|*ráda|rádi'),C('Petr a Marta ___ sportujou.','rád|ráda|*rádi'),C('(já, žena) ___ nakupuju.','rád|*ráda|rádi'),C('Pavle, vy ___ lyžujete? (к одному мужчине вежливо)','*rád|rádi|ráda'),I('Karel ___ cestuje. (negace, муж.)','nerad'),I('Eva ___ telefonuje. (negace)','nerada'),I('Oni ___ sportujou. (negace)','neradi')]},

{cz:'Reflexivní SE',ru:'Возвратная частица se',html:`
<p>Русскому «-ся» соответствует отдельное слово <i>se</i>: <i>jmenovat se</i> — называться, <i>mít se</i> — поживать.</p>
<p><b>Главное правило:</b> <i>se</i> стоит на <b>второй позиции</b> в предложении (после первого слова или первой группы слов).</p>
${T(['1','2','3'],['Jmenuju','se','Karel.'],['Já','se','jmenuju Alena.'],['Jak','se','jmenujete?'],['Ten muž','se','jmenuje Josef Nový.'])}`,
ex:[O('Jak se jmenuješ?'),O('Jmenuju se Matěj Adamec.'),O('Ta slečna se jmenuje Maja.'),O('Paní Malá se jmenuje Lucie.'),C('Где правильный порядок?','*Já se jmenuju Alena.|Já jmenuju se Alena.|Se jmenuju Alena.'),C('Где правильный порядок?','Ten muž jmenuje se Josef.|*Ten muž se jmenuje Josef.|Se ten muž jmenuje Josef.','«Ten muž» — одна группа слов на первой позиции, se идёт сразу за ней.')]}
]});

{cz:'Sloveso MÍT a slovesa -AT/-ÁT',ru:'Глагол «иметь» и глаголы на -at',html:`

<p>Так же: <i>čekat, hledat, znát, poslouchat, říkat, odpočívat, dívat se, zpívat, spěchat</i>.</p>`,

{cz:'Posesivní zájmena',ru:'Притяжательные местоимения, вопрос «Čí?»',html:`
${T(['','M','F','Neu'],['já','můj','moje / má','moje / mé'],['ty','tvůj','tvoje / tvá','tvoje / tvé'],['on, ono','jeho','jeho','jeho'],['ona','její','její','její'],['my','náš','naše','naše'],['vy','váš','vaše','vaše'],['oni','jejich','jejich','jejich'])}

{cz:'Maskulinum životné a neživotné',ru:'Одушевлённый и неодушевлённый мужской род',html:`
<p>Мужской род делится на <b>одушевлённый (Mž)</b> — люди и животные — и <b>неодушевлённый (Mn)</b> — вещи. От этого зависят окончания в падежах. Кроме того, у каждого рода есть твёрдые и мягкие образцы:</p>
${T(['','твёрдый / нейтральный','мягкий'],['Mž','student, ekonom','muž, učitel'],['Mn','sešit, mobil','pokoj'],['F','žena','židle, skříň, místnost'],['Neu','město','moře, náměstí'])}`,
ex:[C('pes','*Mž|Mn'),C('stůl','Mž|*Mn'),C('učitel','*Mž|Mn'),C('pokoj','Mž|*Mn'),C('bratr','*Mž|Mn'),C('počítač','Mž|*Mn'),C('kamarád','*Mž|Mn'),C('dárek','Mž|*Mn')]},

{cz:'Nominativ a akuzativ singuláru',ru:'Именительный и винительный падеж ед. ч.',html:`
<p><b>Nominativ</b> (Kdo? Co?) — подлежащее. <b>Akuzativ</b> (Koho? Co?) — прямое дополнение: после <i>mít, znát, hledat, kupovat, poslouchat, dát si</i>… и после предлогов <i>na, o, pro</i>.</p>
<p><b>A = N</b> у неодушевлённого мужского, среднего рода и женских на согласную: <i>Hledám sešit / město / skříň.</i></p>
${T(['','N','A'],['Mž','ten nový student / muž','t<b>oho</b> nov<b>ého</b> student<b>a</b> / muž<b>e</b>'],['Mn','ten nový sešit','ten nový sešit'],['F (-a)','ta nová žena','t<b>u</b> nov<b>ou</b> žen<b>u</b>'],['F (-e)','ta moderní židle','tu moderní židl<b>i</b>'],['Neu','to nové město','to nové město'])}
<p>Местоимения в A: <i>můj → mého (Mž), moje → moji/mou (F); náš → našeho, naše → naši</i>; <i>jeho, její (F: její), jejich</i>.</p>
<div class="pz">Беглое <i>e</i>: <i>dědeček → dědečka, otec → otce, Pavel → Pavla, pes → psa</i>. Слова на <i>-tel</i> идут как <i>muž</i>: <i>učitel → učitele</i>, но <i>manžel → manžela</i>. Несклоняемое <i>super</i>: <i>super film</i>.</div>`,
ex:[I('Mám ___. (bratr)','bratra'),I('Kupuju ___. (zmrzlina)','zmrzlinu'),I('Hledám ___. (učitel)','učitele'),I('Potřebuju ___. (židle)','židli'),I('Znám ___. (to město)','to město'),I('Dám si ___. (dobrá káva)','dobrou kávu'),I('Nemám ___. (malý bratr)','malého bratra'),I('Čekáme na ___. (dědeček)','dědečka'),I('Máme ___. (pes)','psa'),I('Hledám ___. (tvůj černý pes)','tvého černého psa'),I('Kupujeme ___. (skříň)','skříň'),I('Zajímám se o ___. (česká kultura)','českou kulturu'),I('Hledáte ___? (ten nový učitel)','toho nového učitele'),I('Mám rád ___. (naše babička)','naši babičku'),C('Znáš ___?','Pavel|*Pavla|Pavela')]},

{cz:'Mít rád / ráda / rádi',ru:'«Любить что-то»: mít rád + существительное',html:`
<p>С существительным (в аккузативе) — <i>mít rád</i>; с глаголом — просто <i>rád</i>.</p>
${T(['mít rád + substantivum (A)','rád + sloveso'],['Mám rád sport.','Rád sportuju.'],['Má ráda zeleninu.','Ráda vaří.'],['Nemáme rádi ovoce.','Neradi uklízíme.'])}`,
ex:[C('Mám rád ___.','*sport|sportovat|sportuju'),C('___ sportuju.','Mám rád|*Rád|Mám ráda'),C('Jana ___ kávu.','*má ráda|ráda|rád'),I('Má ráda ___. (zelenina)','zeleninu'),I('Nemám rád ___. (čaj)','čaj'),I('Máme rádi ___. (pivo)','pivo'),C('Vy nemáte ___ souseda? (вы, мн. ч.)','rád|*rádi|ráda')]},

{cz:'Reflexivní SI',ru:'Частица si («себе»)',html:`
<p><i>si</i> = «себе»: <i>dát si</i> — взять себе (заказать), <i>objednat si</i> — заказать. Как и <i>se</i>, стоит на <b>второй позиции</b>.</p>

]});

{cz:'Akuzativ osobních zájmen',ru:'Местоимения в винительном: меня, тебя, его…',html:`

x:I('Dobrý den, pane ___! (Svoboda)','Svobodo','Мужская фамилия на -a → -o: pane Svobodo.')}
],

l2r0:[
{t:'Род видно по концу слова',h:`<p>Перед любым падежом сначала узнайте <b>род</b>. В чешском его почти всегда видно по последней букве словарной формы:</p>
${T(['конец слова','род','примеры'],['согласная','M','student, sešit, pokoj'],['-a','F','žena, káva, škola'],['-o','Neu','město, okno, auto'],['-í','Neu','náměstí, nádraží'])}
<p>На русский род не опирайтесь: <i>káva</i> женского рода, хотя «кофе» в русском мужского.</p>`,
x:C('Какого рода <i>banka</i>?','M|*F|Neu','Слово на -a: женский род.')},
{t:'Слова на -e: обычно женские',h:`<p>Большинство слов на <i>-e, -ě</i> женского рода. Среднего рода немного, и их можно выучить списком: все слова на <i>-iště</i> и несколько частых.</p>
${EX('ulice, židle, kuchyně — F','letiště, parkoviště, hřiště — Neu','moře, vejce, srdce, slunce — Neu')}`,
x:C('Какого рода <i>letiště</i> (аэропорт)?','F|*Neu|M','Слова на -iště среднего рода.')},
{t:'Женские на согласную',h:`<p>Есть женские слова на согласную. Их немного, но они частые:</p>
${EX('místnost, radost, národnost — все на -ost','skříň, noc, kancelář, tramvaj, postel — запомнить')}
<p>Совет: учите такие слова сразу с родом, как в списке слов: <i>kancelář (F)</i>.</p>`,
x:C('Какого рода <i>místnost</i>?','M|*F|Neu','Все слова на -ost женского рода.')},
{t:'Твёрдый или мягкий тип',h:`<p>Внутри рода окончание зависит ещё и от <b>последней согласной</b>. Мягкие: <i>ž, š, č, ř, c, j, ď, ť, ň</i> и слова на <i>-tel</i>. Остальные обычно твёрдые.</p>
${EX('sešit → bez sešit[u] — твёрдый','pokoj → bez pokoj[e] — мягкий','student → student[a] — твёрдый','muž → muž[e] — мягкий')}
<p>У мягких в окончаниях чаще <i>-e, -i</i>, у твёрдых <i>-a, -u, -y</i>. В таблицах падежей это две разные строки.</p>`,
x:C('Какой тип у слова <i>počítač</i>?','твёрдый|*мягкий','Последняя согласная č мягкая.')}
],

l3r3:[
{t:'Когда нужен akuzativ',h:`<p>Akuzativ отвечает на вопрос «кого? что?», как русский винительный. Он нужен после большинства глаголов с прямым дополнением и после предлогов <i>na, o, pro, za</i>.</p>
${EX('Mám bratr[a].','Kupuju káv[u].','Čekám na sestr[u].','Dárek pro mamink[u].')}`,
x:C('В каком падеже слово после <i>potřebuju</i>?','nominativ|*akuzativ|lokál','Potřebovat кого? что?: akuzativ.')},
{t:'Часто ничего не меняется',h:`<p>Хорошая новость: у неодушевлённого мужского, среднего рода и женских на согласную akuzativ <b>совпадает</b> с основной формой.</p>
${EX('Mám sešit. — M, вещь','Vidím město. — Neu','Hledám místnost. — F на согласную')}`,
x:C('Vidím ___. (okno)','okna|*okno|oknu','Средний род: akuzativ = nominativ.')},
{t:'Женский род: -a → -u, -e → -i',h:`<p>Женские слова меняются всегда, если кончаются на гласную:</p>
${EX('žena → žen[u]','káva → káv[u]','Praha → Prah[u]','židle → židl[i]','ulice → ulic[i]')}
<p>Прилагательное и <i>ta</i> тоже меняются: <i>t<b>u</b> nov<b>ou</b> kávu</i>.</p>`,
x:I('Kupuju ___. (zmrzlina)','zmrzlinu','Женский род на -a: zmrzlina → zmrzlinu.')},
{t:'Люди и животные: -a / -e',h:`<p>Одушевлённый мужской род (люди, животные) получает <i>-a</i> после твёрдой согласной и <i>-e</i> после мягкой, как русское «вижу студента».</p>
${EX('student → student[a]','bratr → bratr[a]','muž → muž[e]','učitel → učitel[e]')}
<p>Беглое <i>e</i> выпадает:</p>
${EX('otec → otc[e]','pes → ps[a]','Pavel → Pavl[a]')}`,
x:I('Mám ___. (pes)','psa','Животное, e выпадает: pes → psa.')},
{t:'Ловушки',h:`<p>Проверьте, живое ли это: <i>Vidím stůl</i> (вещь не меняется), но <i>Vidím pán<b>a</b></i>.</p>
${EX('ten nový student → toho nov[ého] student[a]','manžel → manžel[a] — исключение, хотя на -l')}`,
x:C('Hledám ___. (učitel)','učitela|*učitele|učitel','Učitel: мягкий тип, как muž → učitele.')}
],

l4r0:[
{t:'Три окончания на всё',h:`<p>Для вещей во множественном числе почти всегда хватает трёх окончаний: <i>-y</i> у твёрдых мужских и женских, <i>-e/-ě</i> у мягких, <i>-a</i> у среднего рода.</p>
${T(['','ед. ч.','мн. ч.'],['M твёрдый','sešit','sešity'],['M мягкий','pokoj','pokoje'],['F на -a','žena','ženy'],['Neu на -o','město','města'])}`,
x:C('dva ___ (sešit)','sešite|*sešity|sešitu','Твёрдый мужской: -y.')},
{t:'Мужской род (вещи)',h:`<p>Твёрдые получают <i>-y</i>, мягкие <i>-e</i>. Долгое <i>ů</i> внутри слова часто становится <i>o</i>.</p>
${EX('jogurt → jogurt[y]','stůl → stol[y]','pokoj → pokoj[e]','počítač → počítač[e]')}`,
x:I('dva ___ (počítač)','počítače','č мягкая: -e.')},
{t:'Женский род',h:`<p>На <i>-a</i>: <i>-y</i>. На <i>-e</i>: без изменений. На согласную: <i>-e/-ě</i> или <i>-i</i> (у слов на <i>-ost</i>).</p>
${EX('káva → káv[y]','židle → židle','skříň → skřín[ě]','místnost → místnost[i]')}`,
x:I('dvě ___ (káva)','kávy','Женский род на -a: -y.')},
{t:'Средний род',h:`<p><i>-o</i> меняется на <i>-a</i>, как в русском «окна». Слова на <i>-e</i> и <i>-í</i> не меняются.</p>
${EX('auto → aut[a]','okno → okn[a]','moře → moře','náměstí → náměstí','dítě → dět[i] — особое слово')}`,
x:I('dvě ___ (auto)','auta','Средний род на -o: -a.')},
{t:'Слова-спутники',h:`<p>Указательное и прилагательное подстраиваются под род: <i>ty</i> и <i>-é</i> у мужских вещей и женского рода, <i>ta</i> и <i>-á</i> у среднего. Числительное: <i>dva</i> для M, <i>dvě</i> для F и Neu.</p>
${EX('ty nov[é] sešity','ty nov[é] ženy','ta nov[á] města','dva sešity, dvě ženy, dvě města')}`,
x:C('___ nová auta','ty|*ta|ti','Средний род мн. ч.: ta nová auta.')}
],

l4r3:[
{t:'Две формы: краткая и полная',h:`<p>У местоимений в akuzativu две формы. <b>Краткая</b> обычная, без ударения. <b>Полная</b> нужна, когда на местоимении логическое ударение или оно стоит первым.</p>
${EX('Petr t[ě] zná. — обычная фраза','Teb[e] zná, ale m[ě] ne. — противопоставление')}`,
x:C('Обычная форма «тебя» в фразе «Петр тебя знает»:','tebe|*tě','Без ударения: краткая форма, Petr tě zná.')},
{t:'Таблица форм',h:`${T(['','кратко','после предлога'],['já','mě','na mě'],['ty','tě','na tebe'],['on, ono','ho','na něj'],['ona','ji','na ni'],['my','nás','na nás'],['vy','vás','na vás'],['oni','je','na ně'])}
<p>Похоже на русское: <i>ho</i> «его», <i>ji</i> «её», <i>je</i> «их».</p>`,
x:I('Vidíte ___? (ona)','ji','Ona → ji.')},
{t:'После предлога: н-',h:`<p>Как в русском «его → на него», после предлога у 3-го лица появляется <i>ň</i>: <i>ho → něj</i>, <i>ji → ni</i>, <i>je → ně</i>.</p>
${EX('Čekám na [něj].','To je pro [ni].','Myslím na [ně].')}`,
x:I('Čekám na ___. (on)','něj|něho','После предлога: na něj (или на něho).')},
{t:'Краткая форма стоит второй',h:`<p>Краткие <i>mě, tě, ho, ji, je</i> ставят на <b>второе место</b> в предложении, сразу после первого слова или группы слов.</p>
${EX('Včera [ho] viděla.','Znáš [ji]?','Moje sestra [tě] zná.')}`,
x:C('Где правильный порядок?','Ho včera viděla.|*Včera ho viděla.|Včera viděla ho.','Краткая форма на втором месте: Včera ho viděla.')}
],

l5r1:[
{t:'Когда нужен genitiv',h:`<p>Genitiv отвечает на «кого? чего?», как русский родительный. Он нужен после предлогов <i>do, z, od, u, bez, vedle, blízko</i>, после слов количества и для принадлежности.</p>
${EX('Jdu do škol[y].','Káva bez cukr[u].','kilo cukr[u]','auto dědečk[a]')}`,
x:C('Какой предлог требует genitiv?','na|*do|v','do + genitiv: do školy.')},
{t:'Женский род',h:`<p><i>-a → -y</i>, а у слов на <i>-e</i> форма не меняется. На согласную: <i>-e/-ě</i> или <i>-i</i>.</p>
${EX('škola → do škol[y]','Praha → z Prah[y]','ulice → z ulice','skříň → ze skřín[ě]','místnost → z místnost[i]')}`,
x:I('Jdu do ___. (škola)','školy','Женский род на -a: -y.')},
{t:'Мужской и средний род',h:`<p>Люди: <i>-a</i> (мягкие <i>-e</i>). Вещи: чаще всего <i>-u</i> (мягкие <i>-e</i>). Средний: <i>-a</i>, на <i>-e, -í</i> без изменений.</p>
${EX('student → od student[a]','muž → od muž[e]','park → blízko park[u]','pokoj → z pokoj[e]','město → z měst[a]','náměstí → z náměstí')}`,
x:I('Bydlím blízko ___. (park)','parku','Вещь мужского рода: -u.')},
{t:'Вещи на -a',h:`<p>Небольшая группа мужских вещей берёт <i>-a</i>, как люди. Их проще запомнить фразами:</p>
${EX('do les[a]','bez chleb[a] — chléb','u kostel[a]','do večer[a]','od čtvrtk[a]','do Krumlov[a], z Berlín[a] — города на -ov, -ín')}`,
x:C('Sendvič bez ___. (chléb)','chlébu|*chleba|chléba','Исключение: bez chleba.')},
{t:'z, od или u',h:`<p><i>z(e)</i>: «из», изнутри места. <i>od</i>: «от», от человека или от места снаружи. <i>u</i>: «у», возле или у кого-то дома.</p>
${EX('ze škol[y]','od doktor[a]','u babičk[y]','od nádraží')}`,
x:C('Jdu ___ doktora.','z|*od|do','От человека: od doktora.')}
],

l5r2:[
{t:'do: внутрь, в город, в страну',h:`<p><i>do</i> + genitiv: туда, куда заходят внутрь, а также в города и страны.</p>
${EX('do kin[a]','do bank[y]','do restaurac[e]','do Prah[y]','do Česk[a]')}`,
x:C('Jedu ___ Prahy.','na|*do|k','Город: do Prahy.')},
{t:'na: учреждения, события, открытые места',h:`<p><i>na</i> + akuzativ: учреждения, события и открытые места. Часто там, где и по-русски «на»: на почту, на вокзал, на концерт.</p>
${EX('na pošt[u]','na nádraží','na koncert','na výlet','na oběd','na univerzit[u] — по-русски «в университет»')}`,
x:C('Jdu ___ koncert.','do|*na|k','Событие: na koncert.')},
{t:'k: к человеку',h:`<p>К человеку всегда <i>k/ke</i> + dativ, никогда не <i>do</i>.</p>
${EX('k doktor[ovi]','ke kamarádc[e]','k babičc[e]')}`,
x:C('Jdu ___ zubaři.','do|na|*k','К человеку: k zubaři.')},
{t:'Где? Те же пары',h:`<p>На вопрос «где?» пары сохраняются: <i>do</i> становится <i>v</i>, <i>na</i> остаётся <i>na</i>, но падеж уже lokál.</p>
${EX('do kina → v kin[ě]','do banky → v ban[ce]','na poštu → na pošt[ě]','k doktorovi → u doktor[a]')}`,
x:C('Kde jsi? ___ kině.','Na|*V|Do','Kino: do kina, значит v kině.')}
],

l7r0:[
{t:'Когда нужен genitiv мн. ч.',h:`<p>Чаще всего после чисел от 5, после <i>hodně, málo, moc, kolik, několik</i> и после предлогов с genitivem.</p>
${EX('pět student[ů]','hodně knih','kolik sester?','bez peněz')}`,
x:C('pět ___ (student)','studenti|*studentů|studenty','После 5 и больше: genitiv мн. ч., studentů.')},
{t:'Мужской род: -ů',h:`<p>Все мужские, живые и неживые, твёрдые и мягкие, получают <i>-ů</i>.</p>
${EX('bratr → bratr[ů]','muž → muž[ů]','sešit → sešit[ů]','pokoj → pokoj[ů]')}`,
x:I('Kolik máš ___? (bratr)','bratrů','Мужской род: -ů.')},
{t:'Женский на -a и средний на -o: без окончания',h:`<p>Окончание просто отпадает, как в русском «много книг».</p>
${EX('kniha → knih','žena → žen','město → měst','auto → aut')}`,
x:I('Mám pět ___. (kniha)','knih','Женский на -a: окончание отпадает, knih.')},
{t:'Вставное e',h:`<p>Если в конце остаются две согласные подряд, между ними часто вставляется <i>e</i>, как в русском «сестёр, окон».</p>
${EX('sestra → sest[e]r','okno → ok[e]n','učitelka → učitel[e]k','divadlo → divad[e]l')}`,
x:I('Kolik máš ___? (sestra)','sester','Вставное e: sester.')},
{t:'Мягкие: -í',h:`<p>Мягкие женские и средние получают <i>-í</i>. Слова на <i>-ice</i> просто теряют <i>-e</i>.</p>
${EX('židle → židl[í]','místnost → místnost[í]','moře → moř[í]','ulice → ulic','lidé → lid[í], děti → dět[í], peníze → peněz')}`,
x:I('Bez ___ to nejde. (peníze)','peněz','Особое слово: peníze → peněz.')}
],

l8r0:[
{t:'Всегда с предлогом',h:`<p>Lokál отвечает на «о ком? о чём? где?», как русский предложный. Он бывает <b>только</b> с предлогами <i>v/ve, na, o, po, při</i>.</p>
${EX('Bydlím v Praz[e].','Mluvíme o bratr[ovi].','Jsem na pošt[ě].')}`,
x:C('Какой предлог НЕ требует lokál?','v|na|o|*do','do требует genitiv. Lokál идёт с v, na, o, po, při.')},
{t:'Женский род и чередования',h:`<p>Женские на <i>-a</i> получают <i>-ě/-e</i>. Перед ним меняются согласные:</p>
${EX('kavárna → v kavárn[ě]','škola → ve škol[e]','Praha → v Pra[ze] — h → z','matka → o mat[ce] — k → c','sestra → o ses[tře] — r → ř','židle → na židl[i]','místnost → v místnost[i]')}`,
x:I('Bydlím v ___. (Praha)','Praze','h → z: v Praze.')},
{t:'Вещи: -u или -ě',h:`<p>Мужской и средний род берут <i>-u</i> после <i>k, g, h, ch, r</i>, в иностранных словах и названиях месяцев. Многие короткие чешские слова берут <i>-ě/-e</i>. Мягкие получают <i>-i</i>.</p>
${EX('park → v park[u]','hotel → v hotel[u]','leden → v lednu','dům → v dom[ě]','stůl → na stol[e]','město → ve měst[ě]','metro → v metr[u]','pokoj → v pokoj[i]')}`,
x:I('Jsme v ___. (park)','parku','После k: -u, v parku.')},
{t:'Люди: -ovi',h:`<p>О людях говорят с <i>-ovi</i>: «о ком?» Мягкие имеют <i>-i</i> или <i>-ovi</i>. С именем и фамилией лучше <i>-ovi</i>.</p>
${EX('kamarád → o kamarád[ovi]','pan Novák → o pan[u] Novák[ovi]','Tomáš → o Tomáš[ovi]','muž → o muž[i]')}`,
x:I('Mluvím o ___. (kamarád)','kamarádovi','О человеке: -ovi.')},
{t:'Прилагательные и na/v',h:`<p>Прилагательные: <i>-ém</i> у мужского и среднего рода, <i>-é</i> у женского. Для «где?» сохраняются пары с «куда?»: <i>do banky → v bance</i>, <i>na poštu → na poště</i>.</p>
${EX('v t[om] nov[ém] hotelu','v t[é] mal[é] kavárně','na univerzit[ě]')}`,
x:C('Studuje ___ univerzitě.','v|*na|ve','Univerzita идёт с na: na univerzitě.')}
],

l8r2:[
{t:'Форма на -l, как в русском',h:`<p>Прошедшее время строится от инфинитива: <i>-t</i> меняется на <i>-l</i>, а род и число показывает окончание, как в русском «делал, делала».</p>
${EX('dělat → děla[l], děla[la], děla[lo], děla[li]','být → by[l], by[la]')}`,
x:I('Ona ___ doma. (být)','byla','Ona → byla.')},
{t:'Я, ты, мы, вы: + jsem',h:`<p>Главное отличие от русского. В 1-м и 2-м лице добавляется <i>jsem, jsi, jsme, jste</i>. В 3-м лице его нет.</p>
${T(['','ед. ч.','мн. ч.'],['1','dělal jsem','dělali jsme'],['2','dělal jsi','dělali jste'],['3','dělal','dělali'])}`,
x:C('«Я был дома» по-чешски:','Byl doma.|*Byl jsem doma.|Jsem byl doma.','1-е лицо: byl jsem. Порядок: jsem на втором месте.')},
{t:'Неправильные формы',h:`<p>Эти глаголы надо выучить: их форма на <i>-l</i> отличается от инфинитива.</p>
${EX('jít → šel, šla','jíst → jedl','mít → měl','chtít → chtěl','moct → mohl','číst → četl','říct → řekl','vzít → vzal')}`,
x:I('Kam ___ Petr? (jít)','šel','jít → šel.')},
{t:'jsem стоит вторым',h:`<p><i>jsem, jsi, jsme, jste</i> всегда стоят на <b>втором месте</b> в предложении. Первым может быть что угодно.</p>
${EX('Včera [jsem] byl v kině.','Byl [jsem] v kině.','V kině [jsem] byl včera.')}`,
x:C('Где правильный порядок?','Jsem včera byl v kině.|*Včera jsem byl v kině.|Včera byl v kině jsem.','jsem на втором месте: Včera jsem byl v kině.')},
{t:'Отрицание и «Вы»',h:`<p><i>ne-</i> пишется слитно с глаголом. При вежливом «Вы» форма на <i>-l</i> в ед. ч., а <i>jste</i> во мн.: <i>Byl jste…?</i></p>

<script>
// Task generators: fresh exercises for every grammar rule, keyed by rule id like GUIDES.
// GEN[ruleId]() returns one exercise shaped like C(), I(), O(), M() build it; an O() task may list other right word orders in alt.
// The forms come from the tables below. After a change, run: node tools/check-gen.js (from site-slova/).
const GEN=(()=>{
// ---------- forms: nouns, adjectives, pronouns, verbs ----------
const pick=a=>a[Math.random()*a.length|0];
const mixed=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const some=(a,n)=>mixed(a).slice(0,n);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const low=s=>s.charAt(0).toLowerCase()+s.slice(1);
const VOW='aeiouyáéíóúůýě';
const isV=c=>VOW.includes(c);
// one form or several right ones, written "a/b"
const alts=s=>s.split('/');

// the ending -ě / -e after a hard stem: matka → matce, kniha → knize, sestra → sestře, škola → škole
function palE(st){
  if(st.endsWith('ch'))return st.slice(0,-2)+'še';
  const c=st.slice(-1),b=st.slice(0,-1);
  if(c==='k')return b+'ce';
  if(c==='h'||c==='g')return b+'ze';
  if(c==='r')return b+'ře';
  if('dtnbpvmf'.includes(c))return st+'ě';
  return st+'e';
}
// Mž nominative plural: kluk → kluci, Čech → Češi, bratr → bratři
function palI(st){
  if(st.endsWith('ch'))return st.slice(0,-2)+'ši';
  const c=st.slice(-1),b=st.slice(0,-1);
  if(c==='k')return b+'ci';
  if(c==='h'||c==='g')return b+'zi';
  if(c==='r')return b+'ři';
  return st+'i';
}
// locative plural of hard masculines: parcích, úřednících, Češích
function locPl(st){
  if(st.endsWith('ch'))return st.slice(0,-2)+'ších';
  const c=st.slice(-1),b=st.slice(0,-1);
  if(c==='k')return b+'cích';
  if(c==='h'||c==='g')return b+'zích';
  return st+'ech';
}
// zero ending of the genitive plural: kamarádka → kamarádek, okno → oken, město → měst
function zeroPl(st){
  const a=st.slice(-2,-1),b=st.slice(-1);
  if(isV(a)||isV(b)||a+b==='st'||a+b==='sk')return st;
  return st.slice(0,-1)+'e'+b;
}

// classes: mh Mž hard (student), ms Mž soft (muž), ih Mn hard (hrad), is Mn soft (stroj),
// fh F -a (žena), fs F -e/-ě (růže), fc F soft consonant (píseň), fk F -ost (kost),
// nh Neu -o (město), ns Neu -e (moře), ni Neu -í (stavení)
const CASES=['N','G','D','A','V','L','I','N2','G2','D2','A2','L2','I2'];
function decl(nom,cl,ov){
  const st=ov.st||nom,f={N:nom};
  const s1=nom.slice(0,-1);
  if(cl==='mh'){
    Object.assign(f,{G:st+'a',D:st+'ovi',A:st+'a',L:st+'ovi',I:st+'em',
      V:/(k|h|g|ch)$/.test(st)?st+'u':/[^aeiouyáéíóúůý]r$/.test(st)?st.slice(0,-1)+'ře':st+'e',
      N2:palI(st),A2:st+'y',G2:st+'ů',D2:st+'ům',L2:locPl(st),I2:st+'y'});
  }else if(cl==='ms'){
    const d=ov.nm?st+'ovi/'+st+'i':st+'i/'+st+'ovi';
    Object.assign(f,{G:st+'e',D:d,A:st+'e',L:d,I:st+'em',V:st.endsWith('c')?st.slice(0,-1)+'če':st+'i',
      N2:nom.endsWith('tel')?st+'é':st+'i',A2:st+'e',G2:st+'ů',D2:st+'ům',L2:st+'ích',I2:st+'i'});
  }else if(cl==='ih'){
    Object.assign(f,{G:st+'u',D:st+'u',A:nom,L:st+'u',I:st+'em',
      N2:st+'y',A2:st+'y',G2:st+'ů',D2:st+'ům',L2:locPl(st),I2:st+'y'});
    if(ov.Le)f.L=palE(st);
  }else if(cl==='is'){
    Object.assign(f,{G:st+'e',D:st+'i',A:nom,L:st+'i',I:st+'em',
      N2:st+'e',A2:st+'e',G2:st+'ů',D2:st+'ům',L2:st+'ích',I2:st+'i'});
  }else if(cl==='fh'){
    const t=ov.st||s1;
    Object.assign(f,{G:t+'y',D:palE(t),A:t+'u',V:t+'o',L:palE(t),I:t+'ou',
      N2:t+'y',A2:t+'y',G2:/[^aeiouyáéíóúůý]k$/.test(t)?t.slice(0,-1)+'ek':t,D2:t+'ám',L2:t+'ách',I2:t+'ami'});
  }else if(cl==='fs'){
    const t=s1,e=nom.endsWith('ě');
    Object.assign(f,{G:nom,D:t+'i',A:t+'i',V:nom,L:t+'i',I:t+'í',
      N2:nom,A2:nom,G2:/ic$/.test(t)?t:/yn$/.test(t)?t.slice(0,-1)+'ň':t+'í',D2:t+'ím',L2:t+'ích',I2:t+(e?'ěmi':'emi')});
  }else if(cl==='fc'){
    // skříň: skřín-ě, skřín-i; postel: postel-e, postel-i
    const h={ň:'n',ď:'d',ť:'t'}[st.slice(-1)],b=h?st.slice(0,-1)+h:st,g=b+(h?'ě':'e');
    Object.assign(f,{G:g,D:b+'i',A:nom,L:b+'i',I:b+'í',N2:g,A2:g,G2:b+'í',D2:b+'ím',L2:b+'ích',I2:g+'mi'});
  }else if(cl==='fk'){
    Object.assign(f,{G:nom+'i',D:nom+'i',A:nom,L:nom+'i',I:nom+'í',N2:nom+'i',A2:nom+'i',G2:nom+'í',D2:nom+'em',L2:nom+'ech',I2:nom+'mi'});
  }else if(cl==='nh'){
    const t=s1;
    Object.assign(f,{G:t+'a',D:t+'u',A:nom,V:nom,L:/(k|h|g|ch|r)$/.test(t)?t+'u':palE(t),I:t+'em',
      N2:t+'a',A2:t+'a',G2:zeroPl(t),D2:t+'ům',L2:t+'ech',I2:t+'y'});
  }else if(cl==='ns'){
    const t=s1,e=nom.endsWith('ě');
    Object.assign(f,{G:nom,D:t+'i',A:nom,L:t+'i',I:t+(e?'ěm':'em'),N2:nom,A2:nom,G2:t+'í',D2:t+'ím',L2:t+'ích',I2:t+'i'});
  }else if(cl==='ni'){
    Object.assign(f,{G:nom,D:nom,A:nom,L:nom,I:nom+'m',N2:nom,A2:nom,G2:nom,D2:nom+'m',L2:nom+'ch',I2:nom+'mi'});
  }
  CASES.forEach(k=>{if(ov[k])f[k]=ov[k]});
  const out={};CASES.forEach(k=>{if(f[k])out[k]=alts(f[k])});
  return out;
}
// gender for agreement: mz Mž, mn Mn, f, n
const GENDER={mh:'mz',ms:'mz',ih:'mn',is:'mn',fh:'f',fs:'f',fc:'f',fk:'f',nh:'n',ns:'n',ni:'n'};

// nom|class|russian|tags|overrides (key=value, «/» separates right variants)
// tags: p person, a animal, fam family, t thing, fur furniture, food, drink, pl place, city, land, subj school subject, top topic, tr transport, wr writing tool
const NOUN_SRC=`

function adjPalI(b){
  if(b.endsWith('sk'))return b.slice(0,-2)+'št';

}
// adj(word, case, gender): case N…I or N2…I2, gender mz mn f n
function adj(a,k,g){
  const b=a.slice(0,-1),m=g==='mz'||g==='mn';
  if(a.endsWith('ý')){
    const T={N:m?'ý':g==='f'?'á':'é',G:g==='f'?'é':'ého',D:g==='f'?'é':'ému',A:g==='mz'?'ého':g==='mn'?'ý':g==='f'?'ou':'é',
      L:g==='f'?'é':'ém',I:g==='f'?'ou':'ým',N2:g==='n'?'á':'é',G2:'ých',D2:'ým',A2:g==='n'?'á':'é',L2:'ých',I2:'ými'};
    if(k==='N2'&&g==='mz')return adjPalI(b)+'í';
    return b+T[k];
  }
  const T={N:'í',G:g==='f'?'í':'ího',D:g==='f'?'í':'ímu',A:g==='mz'?'ího':'í',L:g==='f'?'í':'ím',I:g==='f'?'í':'ím',
    N2:'í',G2:'ích',D2:'ím',A2:'í',L2:'ích',I2:'ími'};
  return b+T[k];
}

    return T[k];
  }
  const p={'můj':'m','tvůj':'tv','svůj':'sv'}[w];
  const T={N:m?w:g==='f'?p+'oje/'+p+'á':p+'oje/'+p+'é',G:g==='f'?p+'é/'+p+'ojí':p+'ého',D:g==='f'?p+'é/'+p+'ojí':p+'ému',

<script>
(function(){
'use strict';
document.documentElement.lang='ru';

// ---------- shared helpers ----------
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
// the two standalone pages used cz-a1a2-done / cz-a1a2-lesson (grammar) and "known" (words)
const KEYS={done:'cz-a1a2-done',lesson:'cz-a1a2-lesson',section:'cz-a1a2-section',known:'cz-a1a2-known',words:'cz-a1a2-words',mem:'cz-a1a2-mem',glog:'cz-a1a2-glog',day:'cz-a1a2-day',guide:'cz-a1a2-guide'};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const stripMarks=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const plural=(n,f)=>{const a=n%100,b=n%10;return f[a>10&&a<20?2:b===1?0:b>=2&&b<=4?1:2]};
const motionOK=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches;
const svg=(d,w)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2.2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON={
  check:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>',2.4),
  cross:svg('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',2.4),
  speak:svg('<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>',2),
  shift:svg('<path class="arrow" d="M12 4 4.5 11.5H9V17h6v-5.5h4.5z"/><path class="bar" d="M9 20.5h6"/>',2),
  chev:svg('<path d="M9.5 6l6 6-6 6"/>',2.2)
};
const live=$('#live');
const announce=msg=>{live.textContent='';setTimeout(()=>{live.textContent=msg},40)};

// ---------- data ----------
GRAM.forEach(L=>L.rules.forEach((r,ri)=>{r.id=`l${L.n}r${ri}`;r.ex.forEach((x,xi)=>{x.id=`${r.id}x${xi}`})}));
Object.entries(GUIDES).forEach(([rid,g])=>g.forEach((s,i)=>{if(s.x)s.x.id=`${rid}g${i}`}));
const WORDS={};
Object.keys(D).forEach(k=>{
  WORDS[k]=D[k].split('\n').map(l=>l.split(' | ')).filter(p=>p.length===2&&p[0].trim()&&p[1].trim())
    .map(([cz,ru])=>({id:k+'|'+cz.trim(),n:+k,cz:cz.trim(),ru:ru.trim()}));
});
const LAST=GRAM.length;

// ---------- progress ----------
const strings=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'):[];
function loadKnown(){
  const v=store.get(KEYS.known,null);
  if(Array.isArray(v))return strings(v);
  const old=store.get('known',null);
  if(Array.isArray(old)&&old.length&&old.every(x=>typeof x==='string'&&/^\d+\|/.test(x))){store.set(KEYS.known,old);return old}
  return [];
}
const done=new Set(strings(store.get(KEYS.done,[])));
const saveDone=()=>store.set(KEYS.done,[...done]);
const gramItems=L=>L.rules.flatMap(r=>r.ex);
const gramStat=n=>{const it=gramItems(GRAM[n-1]);return{done:it.filter(x=>done.has(x.id)).length,total:it.length}};
const pct=s=>s.total?Math.round(s.done/s.total*100):0;

// ---------- memory: spaced repetition of words ----------
// A word climbs levels 1-7. Each correct answer on the day it is due moves it up one level, a mistake
// sends it back to level 1. Level 3 and above counts as learned: the word was written correctly on two
// different days after it was first learned. IV holds the days until the next review for each level.
const IV=[0,1,2,4,7,14,30,60],LEARNED=3;
// study days end at 4 am, so a late evening session still counts for that day
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4-4*36e5)/864e5);
const hashId=s=>{let h=0;for(const c of s)h=(h*31+c.codePointAt(0))>>>0;return h};
const Mem=(()=>{
  const w={}; // id → [level, due day, correct answers, mistakes]
  const raw=store.get(KEYS.mem,null);
  if(raw&&raw.w&&typeof raw.w==='object'){
    for(const [id,v] of Object.entries(raw.w))if(Array.isArray(v)&&v.length>=2&&Number.isFinite(v[0])&&Number.isFinite(v[1])&&v[0]>0)w[id]=[Math.min(v[0]|0,IV.length-1),v[1]|0,v[2]|0,v[3]|0];
  }else{
    // first run of the spaced trainer: words marked as known stay learned and come up for a check within a week
    const t=today();loadKnown().forEach(id=>{w[id]=[LEARNED,t+1+hashId(id)%7,0,0]});
    save();
  }
  // cz-a1a2-known keeps listing the learned words, so the older pages still read them
  function save(){store.set(KEYS.mem,{v:1,w});store.set(KEYS.known,Object.keys(w).filter(id=>w[id][0]>=LEARNED))}
  const put=(id,l,d,ok,bad)=>{const m=w[id]||[0,0,0,0];w[id]=[l,d,m[2]+(ok||0),m[3]+(bad||0)];save()};
  return {
    level:id=>w[id]?w[id][0]:0,
    dueDay:id=>w[id]?w[id][1]:null,
    learnt(id){put(id,1,today()+IV[1],1)},              // a new word was written correctly for the first time
    know(id){put(id,LEARNED,today()+IV[LEARNED],1)},    // the learner says the word is already known
    promote(id){put(id,LEARNED,today()+2,1)},           // «Урок за день»: written right in the evening check, checked again in 2 days
    reset(ids){ids.forEach(id=>{delete w[id]});save()},
    // res: 'ok', 'near' (right except diacritics) or 'fail'. An early correct answer leaves the schedule alone.
    answer(id,res){
      const t=today(),m=w[id];
      if(!m){if(res==='ok')put(id,1,t+IV[1],1);return}
      if(res==='ok'){if(m[1]>t)return;const l=Math.min(IV.length-1,m[0]+1);put(id,l,t+IV[l],1)}
      else if(res==='near')put(id,Math.max(1,m[0]-1),t+1,0,1);
      else put(id,1,t+1,0,1);
    }
  };
})();
const wordStat=n=>{
  const ws=WORDS[n]||[],t=today();let k=0,l=0,due=0;
  ws.forEach(w=>{const v=Mem.level(w.id);if(!v)return;if(v>=LEARNED)k++;else l++;if(Mem.dueDay(w.id)<=t)due++});
  return{done:k,learning:l,due,total:ws.length};
};

// ---------- grammar log: how the last attempt at each exercise went ----------
// id → [1 solved at the first try, 0 with a mistake; study day]. The mixed training starts from the mistakes.
const glog=(v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{})(store.get(KEYS.glog,{}));
const weakEx=id=>!!glog[id]&&glog[id][0]===0;
const logEx=(id,ok)=>{glog[id]=[ok?1:0,today()];store.set(KEYS.glog,glog)};
// «Разбор по шагам»: ruleId → {s: the furthest step opened, d: 1 once the walkthrough was finished}
const gstate=(v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{})(store.get(KEYS.guide,{}));

const FOOT='<p>Грамматика — по разделам учебника «Čeština pro cizince A1/A2» (Boccou Kestřánková, Štěpánková, Vodičková). Объяснения сокращены, упражнения составлены заново. Слова — по словарю из письма Романы Грмеловой.</p><p>Прогресс сохраняется только в этом браузере.</p>';

// ---------- shell: navigation, header, routing ----------
const app={lesson:0,section:'gram'};
const nav=$('#nav'),view=$('#view');
const hashFor=(n,s)=>'#l'+n+(s==='slova'?'-slova':'');
function parseHash(){
  const m=/^#l(\d{1,2})(?:r(\d{1,2}))?(?:-(slova|gramatika))?$/.exec(location.hash);
  return m?{n:+m[1],rule:m[2]!=null?+m[2]:null,section:m[3]==='slova'?'slova':'gram'}:null;
}

function buildNav(){
  nav.innerHTML=GRAM.map(L=>`<a href="#l${L.n}" data-n="${L.n}"><span class="num">${L.n}</span><span class="t"><span>${esc(L.cz)}</span><span class="due" hidden></span></span><span class="bars" aria-hidden="true"><span class="bar"><i></i></span><span class="bar"><i class="mid"></i><i></i></span></span></a>`).join('');
}
// the words bar: learned words in green over the ones still being learned
function wordBar(bar,w){
  $('i.mid',bar).style.width=(w.total?Math.round((w.done+w.learning)/w.total*100):0)+'%';
  $('i:not(.mid)',bar).style.width=pct(w)+'%';
}
const wordsLabel=w=>`выучено ${w.done} из ${w.total}`+(w.learning?`, учатся ${w.learning}`:'')+(w.due?`, на повторение ${w.due}`:'');
function updateNav(){
  $$('a',nav).forEach(a=>{
    const n=+a.dataset.n,g=gramStat(n),w=wordStat(n);
    a.setAttribute('href',hashFor(n,app.section));
    if(n===app.lesson)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
    const b=$$('.bar',a);$('i',b[0]).style.width=pct(g)+'%';wordBar(b[1],w);
    const d=$('.due',a);d.hidden=!w.due;d.textContent=w.due;
    a.setAttribute('aria-label',`Урок ${n}: ${GRAM[n-1].cz}. Грамматика: решено ${g.done} из ${g.total}. Слова: ${wordsLabel(w)}`);
  });
}
function centerNav(){
  if(!matchMedia('(max-width:820px)').matches)return;
  const a=$('a[aria-current]',nav);if(a)nav.scrollLeft=a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2;
}
function refreshProgress(){
  updateNav();
  const n=app.lesson,g=gramStat(n),w=wordStat(n);
  const tabs=$$('.sections a',view);
  if(tabs.length===2){
    $('.sm',tabs[0]).textContent=`решено ${g.done} из ${g.total}`;$('.bar i',tabs[0]).style.width=pct(g)+'%';
    $('.sm',tabs[1]).textContent=`выучено ${w.done} из ${w.total}`+(w.due?`, на повторение ${w.due}`:'');wordBar($('.bar',tabs[1]),w);
  }
  if(app.section==='gram')Grammar.refresh();else Words.refresh();
}
function render(){
  const L=GRAM[app.lesson-1];
  kbd.hidden=true;
  view.innerHTML='';
  const head=el('header','lhead',`<div class="lnum" aria-hidden="true">${L.n}</div><div class="ltitle"><h1 tabindex="-1"><span class="sr">Урок ${L.n}. </span>${esc(L.cz)}</h1><p>${esc(L.ru)}</p></div>`);
  const tabs=el('nav','sections',[['gram','Грамматика'],['slova','Слова']].map(([s,t])=>`<a href="${hashFor(L.n,s)}" data-s="${s}"${s===app.section?' aria-current="page"':''}><b>${t}</b><span class="sm"></span><span class="bar" aria-hidden="true">${s==='slova'?'<i class="mid"></i>':''}<i></i></span></a>`).join(''));
  tabs.setAttribute('aria-label','Раздел урока');
  const panel=el('div',app.section==='gram'?'gpanel':'wpanel');
  view.append(head,tabs,panel);
  if(app.section==='gram')Grammar.render(panel,L);else Words.render(panel,L.n);
  view.appendChild(el('footer','foot',FOOT));
  refreshProgress();
  centerNav();
}
function route(byUser){
  const h=parseHash();
  let n=h?h.n:+store.get(KEYS.lesson,1);
  let s=h?h.section:store.get(KEYS.section,'gram');
  if(!(n>=1&&n<=LAST))n=1;
  if(s!=='slova')s='gram';
  const prev=document.activeElement;
  const fromTabs=!!(prev&&prev.closest&&prev.closest('.sections'));
  const fromNav=!!(prev&&prev.closest&&prev.closest('#nav'));
  // switching Грамматика/Слова inside one lesson keeps the tabs where they were
  const sameLesson=byUser&&n===app.lesson,y=window.scrollY;
  app.lesson=n;app.section=s;
  store.set(KEYS.lesson,n);store.set(KEYS.section,s);
  if(!h){try{history.replaceState(null,'',hashFor(n,s))}catch(e){}}
  render();
  const target=h&&h.rule!=null&&s==='gram'?document.getElementById(`l${n}r${h.rule}`):null;
  if(target)target.scrollIntoView();else window.scrollTo(0,sameLesson?y:0);
  if(!byUser)return;
  if(fromTabs){const a=$(`.sections a[data-s="${s}"]`);if(a)a.focus({preventScroll:true})}
  else if(!fromNav){const t=target?$('h2',target):$('#view h1');if(t)t.focus({preventScroll:true})}
}

// ---------- grammar: rules and exercises ----------
const Grammar=(()=>{
  const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  const KIND={c:'Выберите',i:'Впишите',o:'Составьте предложение',m:'Соедините пары'};
  const norm=s=>s.toLowerCase().replace(/[„“"«»]/g,'').replace(/\s+/g,' ').replace(/[\s.!?,;:]+$/,'').trim();
  const flat=s=>stripMarks(norm(s));
  const qHTML=q=>q.replace(/___/g,'<span class="gap">…</span>');
  let cur=null,root=null;

  function render(panel,L){
    cur=L;root=panel;
    const toc=el('nav','toc');toc.setAttribute('aria-label','Правила урока');
    L.rules.forEach((r,ri)=>{
      const a=el('a','',`${ROMAN[ri]}. ${esc(r.cz)}${ICON.check}<span class="wk" hidden><span class="sr">, есть ошибки</span></span>`);a.href='#'+r.id;
      a.addEventListener('click',e=>{e.preventDefault();const t=document.getElementById(r.id);if(!t)return;t.scrollIntoView({behavior:motionOK()?'smooth':'auto'});const h=$('h2',t);if(h)h.focus({preventScroll:true})});
      toc.appendChild(a);
    });
    const mixb=el('button','mixbtn','Смешанная тренировка');mixb.type='button';toc.appendChild(mixb);
    const mix=el('section','mix');mix.hidden=true;mix.setAttribute('aria-labelledby','mix-h');
    mixb.addEventListener('click',()=>{
